<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Patforce</title>
<style>
  :root {
    --bg:        #f4f5f7;
    --surface:   #ffffff;
    --surface2:  #f0f2f5;
    --border:    #e4e7ec;
    --border-2:  #d0d5dd;
    --line:      #e4e7ec;
    --text:      #0f1219;
    --muted:     #5b6472;
    --dim:       #98a1af;
    --accent:    #4f46e5;
    --accent-lo: #eef0fe;
    --pos:       #0a7a4f;
    --pos-lo:    #e6f5ee;
    --neg:       #b3341d;
    --neg-lo:    #fdeeea;
    --warn:      #8a5a00;
    --warn-lo:   #fdf3e0;
    --shadow:    0 1px 2px rgba(16,24,40,0.05);
    --ui:  system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;

    /* Categorical slots for the service split, in fixed order - Uber is always
       slot 1 whatever the filter leaves standing. Validated for colour-vision
       deficiency against this surface; every segment is also directly labelled,
       because the aqua sits under 3:1 on white. */
    --src1: #2a78d6;
    --src2: #eb6834;
    --src3: #1baf7a;
    --grid: #eceef2;
  }

  /* ---- charts ---- */
  .plot { width: 100%; display: block; overflow: visible; margin-top: 10px; }
  .gridline { stroke: var(--grid); stroke-width: 1; }
  .vaxis { fill: var(--dim); font-size: 11px; font-family: var(--ui); }
  .vval  { fill: var(--muted); font-size: 11px; font-weight: 600; font-family: var(--mono); }
  .seg-in{ fill: #fff; font-size: 12px; font-weight: 700; font-family: var(--mono); }
  .vbar  { transition: opacity .12s; }
  .vbar:hover, .dot:hover { opacity: .78; }
  /* A partial month is drawn lighter so it cannot be read as a slump. */
  .vbar.partial, .vbar.is-today { opacity: .5; }
  .slot-off   { fill: var(--surface2); }
  .slot-today { fill: none; stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 3 3; }
  .chart-legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px;
                  color: var(--muted); margin-top: 10px; }
  .chart-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px;
                    margin-right: 6px; vertical-align: -1px; }
  .meter { margin-top: 12px; }
  .meter-track { fill: var(--surface2); }
  .meter-mark  { stroke: var(--text); stroke-width: 2; stroke-linecap: round; }
  .meter-labels { display: flex; justify-content: space-between; gap: 12px;
                  font-size: 12px; color: var(--muted); margin-top: 6px; }
  .meter-labels .right { text-align: right; }
  .meter-labels b { color: var(--text); font-family: var(--mono); font-weight: 600; }
  #viz-tip { position: fixed; pointer-events: none; opacity: 0; transition: opacity .1s;
             background: var(--text); color: #fff; font-size: 12px; padding: 6px 9px;
             border-radius: 7px; white-space: nowrap; z-index: 60; font-family: var(--ui);
             box-shadow: 0 4px 14px rgba(16,24,40,.22); }
  #viz-tip b { font-family: var(--mono); }
  @media (max-width: 640px) {
    /* Six months of value labels at phone width turn to mush; the bar heights
       still carry the shape, and the numbers are a tap away. */
    .plot .vval { display: none; }
    .plot .vaxis { font-size: 13px; }
  }
  * { box-sizing: border-box; }
  html, body { max-width: 100%; overflow-x: hidden; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: var(--ui); font-size: 15px; line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  header {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 14px 20px 12px;
  }
  .head-row { display: flex; align-items: baseline; gap: 12px; max-width: 1180px; margin: 0 auto; }
  h1 { font-size: 19px; margin: 0; letter-spacing: -0.01em; }
  /* The app mark, beside the name on every page. Sized from the heading so it
     tracks the smaller phone title without a second rule. */
  h1 .mark {
    width: 1.15em; height: 1.15em; vertical-align: -0.22em;
    margin-right: 8px; border-radius: 26%;
  }

  .spacer { flex: 1; }
  header a {
    color: var(--accent); text-decoration: none; font-size: 13px; font-weight: 500;
    padding: 6px 10px; border-radius: 8px; min-height: 32px; display: inline-flex; align-items: center;
  }
  header a:hover { background: var(--accent-lo); }
  main { max-width: 1180px; margin: 0 auto; padding: 16px 20px 40px; }

  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px 16px; box-shadow: var(--shadow); margin-bottom: 10px;
  }
  .k {
    font-size: 11px; text-transform: uppercase; letter-spacing: .07em;
    color: var(--muted); font-weight: 600;
  }
  .v {
    font-family: var(--mono); font-variant-numeric: tabular-nums;
    font-size: 21px; font-weight: 700; margin-top: 3px; letter-spacing: -0.02em;
  }
  .v.hero { font-size: 34px; }
  .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .thin { font-size: 12px; color: var(--dim); margin-top: 6px; }
  .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .pos { color: var(--pos); }
  .neg { color: var(--neg); }

  .pill {
    display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 8px;
    border-radius: 999px; background: var(--surface2); color: var(--muted);
  }
  .pill.warn { background: var(--warn-lo); color: var(--warn); }

  /* Needs a minute */
  .fix { background: var(--warn-lo); border-color: #f0dfba; }
  .fix a, .fix .row {
    display: flex; align-items: center; gap: 10px; justify-content: space-between;
    min-height: 44px; padding: 6px 0; color: var(--warn); text-decoration: none;
    border-bottom: 1px solid rgba(138,90,0,0.14);
  }
  .fix a:last-child, .fix .row:last-child { border-bottom: 0; }
  .fix .what { font-size: 14px; font-weight: 600; }
  .fix .go { font-size: 18px; opacity: .55; }

  /* Rows with a proportional bar */
  .bar-row { margin-top: 10px; }
  .bar-row:first-of-type { margin-top: 6px; }
  .bar-line { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; font-size: 13px; }
  .bar-track { height: 8px; border-radius: 999px; background: var(--surface2); margin-top: 5px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 999px; background: var(--accent); opacity: .75; }
  .bar-fill.muted { background: var(--dim); opacity: .5; }
  .bar-empty {
    height: 8px; border-radius: 999px; margin-top: 5px;
    border: 1px dashed var(--border-2); background: transparent;
  }

  .foot { font-size: 11px; color: var(--dim); margin-top: 14px; line-height: 1.6; }
  .stale { color: var(--warn); }

  @media (max-width: 640px) {
    main { padding: 12px 12px 32px; }
    header { padding: 12px 12px 10px; }
    .card { padding: 12px 13px; }
    .v { font-size: 20px; }
    .v.hero { font-size: 31px; }
  }
</style>
</head>
<body>

<header>
  <div class="head-row">
    <h1><svg class="mark" viewBox="0 0 512 512" aria-hidden="true" focusable="false">
      <rect width="512" height="512" rx="112" fill="#d97706"/>
      <g fill="#fffbeb">
        <rect x="122" y="252" width="68" height="120" rx="16"/>
        <rect x="222" y="182" width="68" height="190" rx="16"/>
        <rect x="322" y="112" width="68" height="260" rx="16"/>
      </g>
    </svg>Patforce</h1>
    <span class="spacer"></span>
    <a href="/records">Records &rarr;</a>
  </div>
</header>

<main id="app">
  <div class="card"><div class="k">Loading</div><div class="v">&mdash;</div></div>
</main>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const el = (t, a = {}, kids = []) => {
    const n = document.createElement(t);
    for (const [k, v] of Object.entries(a)) {
      if (k === 'text') n.textContent = v;
      else if (k === 'html') n.innerHTML = v;
      else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
      else if (v !== null && v !== undefined) n.setAttribute(k, v);
    }
    for (const c of [].concat(kids)) if (c) n.append(c);
    return n;
  };

  // An em-dash for a missing figure, never a zero. Several rate columns in this
  // schema are CASE ... ELSE 0, so a zero that reached the screen would be
  // indistinguishable from "you earned nothing per hour" on a real $224 week.
  const money = (v, dp = 2) => (v === null || v === undefined) ? '—'
    : '$' + Number(v).toLocaleString('en-US', { minimumFractionDigits: dp, maximumFractionDigits: dp });
  const money0 = v => money(v, 0);
  const plural = (n, w) => n + ' ' + w + (Number(n) === 1 ? '' : 's');
  const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const parseDay = iso => new Date(String(iso).slice(0, 10) + 'T12:00:00');
  const dayLabel = iso => { const d = parseDay(iso); return DAYS[d.getDay()] + ' ' + d.getDate() + ' ' + MONTHS[d.getMonth()]; };
  const shortDay = iso => { const d = parseDay(iso); return d.getDate() + ' ' + MONTHS[d.getMonth()]; };
  const withYear = iso => { const d = parseDay(iso); return shortDay(iso) + ' ' + d.getFullYear(); };
  const ordinal = n => n + ([,'st','nd','rd'][n % 100 >> 3 ^ 1 && n % 10] || 'th');

  const card = (kids, cls) => el('div', { class: 'card' + (cls ? ' ' + cls : '') }, kids);
  const K = t => el('div', { class: 'k', text: t });
  const V = (t, hero) => el('div', { class: 'v' + (hero ? ' hero' : ''), text: t });
  const S = t => el('div', { class: 's', text: t });
  const T = t => el('div', { class: 'thin', text: t });

  /** A signed delta, coloured, with the comparison spelled out beside it. */
  // The shift count travels with the money. Calendar day 10 of September holds
  // eight weekdays where August's held six, and he has never worked a weekend, so
  // equal date ranges are not equal chances to earn. Printing both stops the delta
  // implying a slump that is really a shorter stretch of working days.
  const deltaLine = (label, priorIncome, delta, priorShifts) => {
    if (priorShifts === 0) return T(label + ': no shifts');
    const line = el('div', { class: 'thin' });
    line.append(document.createTextNode(
      label + ': ' + money(priorIncome) + ' from ' + plural(priorShifts, 'shift') + '  '));
    const sign = delta >= 0 ? '+' : '−';
    line.append(el('span', {
      class: delta >= 0 ? 'pos' : 'neg',
      text: sign + money(Math.abs(delta))
    }));
    return line;
  };

  const barRow = (label, value, pct, opts = {}) => {
    const row = el('div', { class: 'bar-row' }, [
      el('div', { class: 'bar-line' }, [
        el('span', { text: label }),
        el('span', { class: 'num', text: value })
      ])
    ]);
    row.append(opts.empty
      ? el('div', { class: 'bar-empty' })
      : el('div', { class: 'bar-track' },
          el('div', { class: 'bar-fill' + (opts.muted ? ' muted' : ''), style: 'width:' + Math.max(0, Math.min(100, pct)) + '%' })));
    return row;
  };

  // ---- drawing ------------------------------------------------------------
  // A row of labelled numbers tells you what happened; a shape tells you whether
  // it is going the right way. Everything below draws figures that are already on
  // this page - nothing here computes money.
  const NS = 'http://www.w3.org/2000/svg';
  const svg = (t, a = {}, kids = []) => {
    const n = document.createElementNS(NS, t);
    for (const [k, v] of Object.entries(a)) if (v !== null && v !== undefined) n.setAttribute(k, v);
    for (const c of [].concat(kids)) if (c) n.append(c);
    return n;
  };

  const tip = el('div', { id: 'viz-tip' });
  document.body.append(tip);
  const hoverable = (node, html) => {
    const show = e => {
      const p = e.touches ? e.touches[0] : e;
      tip.innerHTML = html;
      tip.style.opacity = 1;
      tip.style.left = Math.max(6, Math.min(p.clientX + 12, innerWidth - tip.offsetWidth - 6)) + 'px';
      tip.style.top = Math.max(6, p.clientY - tip.offsetHeight - 10) + 'px';
    };
    node.addEventListener('mousemove', show);
    node.addEventListener('touchstart', show, { passive: true });
    node.addEventListener('mouseleave', () => tip.style.opacity = 0);
    node.addEventListener('touchend', () => setTimeout(() => tip.style.opacity = 0, 1600));
    return node;
  };

  /** Rounded at the data end only, square on the baseline it stands on. */
  const vbar = (x, base, w, h, fill, cls) => {
    if (h <= 1) return svg('rect', { x, y: base - 1.5, width: w, height: 1.5, fill, rx: .75 });
    const r = Math.min(4, h, w / 2);
    return svg('path', {
      d: `M${x},${base} v${-(h - r)} q0,${-r} ${r},${-r} h${w - 2 * r} q${r},0 ${r},${r} v${h - r} z`,
      fill, class: 'vbar' + (cls ? ' ' + cls : '')
    });
  };

  const chartCard = (title, subtitle, figure) =>
    card([K(title), subtitle ? S(subtitle) : null, figure].filter(Boolean));

  /** The week, day by day. A day off is an empty slot, not a bar of zero. */
  function weekChart(days) {
    const W = 460, BASE = 118, TOP = 20, BW = 100 / days.length * 4.2;
    const earned = days.filter(x => x.income > 0).map(x => x.income);
    const max = earned.length ? Math.max(...earned) : 1;
    const g = svg('g');
    const gap = (W - days.length * BW) / (days.length + 1);
    for (const t of [0, .5, 1]) {
      g.append(svg('line', { x1: 0, y1: BASE - t * (BASE - TOP), x2: W, y2: BASE - t * (BASE - TOP), class: 'gridline' }));
    }
    days.forEach((day, i) => {
      const x = gap + i * (BW + gap);
      if (day.income > 0) {
        const h = (day.income / max) * (BASE - TOP);
        const bar = vbar(x, BASE, BW, h, 'var(--accent)', day.today ? 'is-today' : null);
        g.append(hoverable(bar, `<b>${money(day.income)}</b>${day.hours > 0 ? ` · ${day.hours} h · ${money(day.income / day.hours)}/hr` : ' · hours not in yet'}`));
        g.append(svg('text', { x: x + BW / 2, y: BASE - h - 7, 'text-anchor': 'middle', class: 'vval' },
          [document.createTextNode(money0(day.income))]));
      } else {
        g.append(svg('rect', { x, y: BASE - 22, width: BW, height: 22, rx: 4, class: day.today ? 'slot-today' : 'slot-off' }));
        g.append(svg('text', { x: x + BW / 2, y: BASE - 28, 'text-anchor': 'middle', class: 'vaxis' },
          [document.createTextNode(day.today ? 'today' : 'off')]));
      }
      g.append(svg('text', { x: x + BW / 2, y: BASE + 17, 'text-anchor': 'middle', class: 'vaxis' },
        [document.createTextNode(day.label)]));
    });
    return svg('svg', { class: 'plot', viewBox: `0 0 ${W} 140`, role: 'img',
      'aria-label': 'Income each day this week: ' + days.map(x =>
        x.label + ' ' + (x.income > 0 ? money(x.income) : 'no shift')).join(', ') }, g);
  }

  /** Six months of income. A month with no records is an empty slot saying so. */
  function monthsChart(ms, sinceIso) {
    const W = 620, BASE = 172, TOP = 26;
    const vals = ms.filter(x => x.income !== null).map(x => Number(x.income));
    const max = vals.length ? Math.max(...vals) : 1;
    const BW = 62, gap = (W - ms.length * BW) / (ms.length + 1);
    const g = svg('g');
    const step = max > 2000 ? 1000 : 500;
    for (let v = 0; v <= max; v += step) {
      const y = BASE - (v / max) * (BASE - TOP);
      g.append(svg('line', { x1: 26, y1: y, x2: W, y2: y, class: 'gridline' }));
      if (v) g.append(svg('text', { x: 0, y: y + 4, class: 'vaxis' },
        [document.createTextNode('$' + v / 1000 + 'k')]));
    }
    ms.forEach((x, i) => {
      const bx = gap + i * (BW + gap);
      if (x.income === null) {
        g.append(svg('text', { x: bx + BW / 2, y: BASE - 8, 'text-anchor': 'middle', class: 'vaxis' },
          [document.createTextNode('none')]));
      } else {
        // The current month and a first month that began mid-month are both
        // partial, and a solid bar beside complete ones would read as a slump.
        const startsMidMonth = sinceIso && String(sinceIso).slice(0, 7) === String(x.monthStart).slice(0, 7) &&
          parseDay(sinceIso).getDate() > 1;
        const partial = x.current || startsMidMonth;
        const h = (Number(x.income) / max) * (BASE - TOP);
        const bar = vbar(bx, BASE, BW, h, 'var(--accent)', partial ? 'partial' : null);
        g.append(hoverable(bar, `<b>${money(x.income)}</b> · ${plural(x.shifts, 'shift')}` +
          (x.current ? ' · still running' : startsMidMonth ? ' · from the ' + ordinal(parseDay(sinceIso).getDate()) : '')));
        g.append(svg('text', { x: bx + BW / 2, y: BASE - h - 8, 'text-anchor': 'middle', class: 'vval' },
          [document.createTextNode(money0(x.income))]));
      }
      g.append(svg('text', { x: bx + BW / 2, y: BASE + 18, 'text-anchor': 'middle', class: 'vaxis' },
        [document.createTextNode(x.label)]));
    });
    return svg('svg', { class: 'plot', viewBox: `0 0 ${W} 196`, role: 'img',
      'aria-label': 'Income by month: ' + ms.map(x =>
        x.label + ' ' + (x.income === null ? 'no records' : money0(x.income))).join(', ') }, g);
  }

  /** Earned per hour, month by month. One series, so no legend - the title names it. */
  function rateChart(ms) {
    const pts = ms.filter(x => x.perHour !== null && x.perHour > 0);
    if (pts.length < 2) return null;
    const W = 460, BASE = 132, TOP = 26;
    const lo = Math.floor(Math.min(...pts.map(p => p.perHour)) / 5) * 5;
    const hi = Math.ceil(Math.max(...pts.map(p => p.perHour)) / 5) * 5;
    const X = i => 34 + i * ((W - 50) / (pts.length - 1));
    const Y = v => BASE - ((v - lo) / (hi - lo || 1)) * (BASE - TOP);
    const g = svg('g');
    for (let v = lo; v <= hi; v += 5) {
      g.append(svg('line', { x1: 30, y1: Y(v), x2: W, y2: Y(v), class: 'gridline' }));
      g.append(svg('text', { x: 0, y: Y(v) + 4, class: 'vaxis' }, [document.createTextNode('$' + v)]));
    }
    g.append(svg('polyline', { points: pts.map((p, i) => `${X(i)},${Y(p.perHour)}`).join(' '),
      fill: 'none', stroke: 'var(--accent)', 'stroke-width': 2,
      'stroke-linecap': 'round', 'stroke-linejoin': 'round' }));
    pts.forEach((p, i) => {
      g.append(hoverable(svg('circle', { cx: X(i), cy: Y(p.perHour), r: 4.5, fill: 'var(--accent)',
        stroke: 'var(--surface)', 'stroke-width': 2, class: 'dot' }),
        `${p.label} · <b>${money(p.perHour)}</b>/hr over ${p.hours} h`));
      g.append(svg('text', { x: X(i), y: BASE + 18, 'text-anchor': 'middle', class: 'vaxis' },
        [document.createTextNode(p.label)]));
    });
    // Label the ends only. A number on every point is a table pretending to be a chart.
    for (const i of [0, pts.length - 1]) {
      g.append(svg('text', { x: X(i), y: Y(pts[i].perHour) - 12, 'text-anchor': 'middle', class: 'vval' },
        [document.createTextNode(money(pts[i].perHour))]));
    }
    return svg('svg', { class: 'plot', viewBox: `0 0 ${W} 156`, role: 'img',
      'aria-label': 'Earned per hour by month: ' + pts.map(p => p.label + ' ' + money(p.perHour)).join(', ') }, g);
  }

  /**
   * A measure against a marker - the bullet idiom. The bar is what has happened;
   * the tick is what it is being held against.
   *
   * Both ends are named on purpose. This page is careful never to set a part
   * period beside a finished one as though they were equals, and a bare bar would
   * do exactly that on a morning when $34 sits next to yesterday's $136. Labelled,
   * the same picture reads as progress towards a mark, which is what it is.
   */
  function compareMeter(value, mark, leftLabel, rightLabel, deltaNode) {
    const W = 460, H = 24;
    const v = Number(value) || 0, mk = Number(mark) || 0;
    const max = Math.max(v, mk) * 1.14 || 1;
    const g = svg('g');
    g.append(svg('rect', { x: 0, y: 5, width: W, height: H, rx: 6, class: 'meter-track' }));
    const w = Math.max((v / max) * W, 3);
    g.append(hoverable(svg('rect', { x: 0, y: 5, width: w, height: H, rx: 6,
      fill: 'var(--accent)', class: 'vbar' }), `<b>${money(v)}</b> · ${leftLabel}`));
    if (mk > 0) {
      const mx = (mk / max) * W;
      g.append(svg('line', { x1: mx, y1: 0, x2: mx, y2: H + 10, class: 'meter-mark' }));
      g.append(hoverable(svg('rect', { x: mx - 7, y: 0, width: 14, height: H + 10, fill: 'transparent' }),
        `<b>${money(mk)}</b> · ${rightLabel}`));
    }
    const plot = svg('svg', { class: 'plot meter', viewBox: `0 0 ${W} ${H + 12}`, role: 'img',
      'aria-label': `${leftLabel} ${money(v)}, against ${rightLabel} ${money(mk)}` }, g);
    const labels = el('div', { class: 'meter-labels' }, [
      el('span', {}, [document.createTextNode(leftLabel + ' '), el('b', { text: money(v) })]),
      el('span', { class: 'right' }, [document.createTextNode(rightLabel + ' '), el('b', { text: money(mk) })])
    ]);
    const box = el('div', {}, [plot, labels]);
    if (deltaNode) box.append(deltaNode);
    return box;
  }

  /** A proportion of a whole - how much of the money the rate above actually covers. */
  function shareMeter(pct, label) {
    const W = 460, H = 18;
    const p = Math.max(0, Math.min(100, Number(pct) || 0));
    const g = svg('g');
    g.append(svg('rect', { x: 0, y: 0, width: W, height: H, rx: 5, class: 'meter-track' }));
    g.append(hoverable(svg('rect', { x: 0, y: 0, width: Math.max((p / 100) * W, 3), height: H, rx: 5,
      fill: p >= 90 ? 'var(--pos)' : p >= 70 ? 'var(--accent)' : 'var(--warn)', class: 'vbar' }),
      `<b>${p}%</b> · ${label}`));
    return el('div', {}, [
      svg('svg', { class: 'plot meter', viewBox: `0 0 ${W} ${H}`, role: 'img',
        'aria-label': p + '% — ' + label }, g),
      el('div', { class: 'meter-labels' }, [el('span', { text: label })])
    ]);
  }

  /** One stacked bar. Every segment is directly labelled, so colour is never the
      only thing carrying identity. */
  function sourceChart(src) {
    const total = src.reduce((a, b) => a + Number(b.income), 0);
    if (!total) return null;
    const W = 460, H = 30, GAP = 2;
    const g = svg('g');
    let x = 0;
    src.forEach((b, i) => {
      const full = (Number(b.income) / total) * W;
      const w = Math.max(full - (i < src.length - 1 ? GAP : 0), 2);
      const seg = svg('rect', { x, y: 4, width: w, height: H, rx: 5, fill: `var(--src${i + 1})`, class: 'vbar' });
      g.append(hoverable(seg, `${b.source} · <b>${money(b.income)}</b> · ${b.share}% of the money`));
      g.append(svg('text', {
        x: x + full / 2, y: full > 46 ? 24 : 50, 'text-anchor': 'middle',
        class: full > 46 ? 'seg-in' : 'vaxis'
      }, [document.createTextNode(b.share + '%')]));
      x += full;
    });
    return svg('svg', { class: 'plot', viewBox: `0 0 ${W} 58`, role: 'img',
      'aria-label': 'Share of income: ' + src.map(b => b.source + ' ' + b.share + '%').join(', ') }, g);
  }

  function render(d) {
    const out = [];

    // ---- freshness ------------------------------------------------------
    // Without this, "last shift Tuesday" on a Thursday morning reads the same
    // whether he did not drive or the Pixit push stopped working.
    if (d.freshness && d.freshness.hoursAgo !== null) {
      const h = d.freshness.hoursAgo;
      const wd = d.freshness.weekdaysAgo;
      const stale = wd === null ? h > 36 : wd >= 2;
      const when = h < 1 ? 'just now' : h < 48 ? Math.round(h) + 'h ago' : Math.round(h / 24) + ' days ago';
      out.push(el('div', { class: 'foot' + (stale ? ' stale' : ''), style: 'margin:0 0 10px' },
        'Last record added ' + when + (stale ? ' — nothing new since' : '')));
    }

    // ---- needs a minute -------------------------------------------------
    // Above the money because it is the only thing here he can act on, it is
    // time-sensitive, and it is why every hourly figure in the app runs high.
    const a = d.attention || {};
    const fixes = [];
    if (a.openShift) {
      const t = a.openShift.clock_in ? new Date(a.openShift.clock_in) : null;
      fixes.push({
        what: 'Still clocked in' + (t ? ' since ' + t.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) : ''),
        sub: a.openShift.record_no + ' · ' + money(a.openShift.total_income) + ' so far',
        href: '/records?tab=shifts'
      });
    }
    if (a.needsClockOut) {
      fixes.push({
        what: plural(a.needsClockOut.count, 'shift') + ' need a clock-out',
        sub: money(a.needsClockOut.income) + ' of earnings · ' +
             shortDay(a.needsClockOut.from) + ' to ' + shortDay(a.needsClockOut.to),
        href: '/records?tab=shifts&needs=clockout'
      });
    }
    if (a.neverClocked) {
      fixes.push({
        what: plural(a.neverClocked.count, 'shift') + ' still need their times',
        sub: money(a.neverClocked.income) + ' of earnings'
      });
    }
    if (a.unlinked) {
      const bits = [];
      if (a.unlinked.income) bits.push(plural(a.unlinked.income, 'income record'));
      if (a.unlinked.expenses) bits.push(plural(a.unlinked.expenses, 'expense'));
      // Say the money, not just the count: unlinked income is counted by the
      // per-service card but by none of the period totals, so it is the one state
      // that makes two figures on this page disagree.
      const amt = Number(a.unlinked.income_amount || 0);
      fixes.push({
        what: 'Not attached to a shift',
        sub: bits.join(' and ') + (amt > 0 ? ' · ' + money(amt) + ' not in the totals above' : ''),
        href: '/records?tab=' + (a.unlinked.income ? 'income' : 'expenses')
      });
    }
    if (fixes.length) {
      const rows = fixes.slice(0, 3).map(f =>
        el('a', { class: 'row', href: f.href || '/records' }, [
          el('div', {}, [
            el('div', { class: 'what', text: f.what }),
            el('div', { style: 'font-size:12px;opacity:.85', text: f.sub })
          ]),
          el('span', { class: 'go', text: '›' })
        ]));
      out.push(card([K('Needs a minute'), ...rows], 'fix'));
    }

    // ---- the hero -------------------------------------------------------
    // Deliberately the last shift, not "today" and not "yesterday". He checks
    // this in the morning before driving, so today is almost always empty; and
    // there is not a single weekend shift on record, so yesterday is blank every
    // Monday. The last shift is always a real number.
    // Pick the hero. Today counts the moment it has money on it; a today row with
    // nothing yet is a day not started, not a zero, so we step past it to the last
    // shift that happened. A PAST shift that earned nothing is shown as itself.
    const recents = d.recentShifts || [];
    let hero = recents[0] || null;
    if (hero && String(hero.shift_date).slice(0, 10) === d.today && Number(hero.total_income) === 0) {
      hero = recents.find(s => String(s.shift_date).slice(0, 10) !== d.today) || hero;
    }
    const after = hero ? recents.filter(s => s.id !== hero.id && String(s.shift_date).slice(0, 10) !== String(hero.shift_date).slice(0, 10)) : [];
    d.lastShift = hero;
    d.prevShift = after[0] || null;

    if (d.lastShift) {
      const isToday = String(d.lastShift.shift_date).slice(0, 10) === d.today;
      const kids = [
        K(isToday ? 'Today so far' : 'Last shift'),
        V(money(d.lastShift.total_income), true),
        S(dayLabel(d.lastShift.shift_date) + '  ·  ' + d.lastShift.record_no)
      ];
      const pills = [];
      if (Number(d.lastShift.shift_hours) === 0 && !d.lastShift.is_open && d.lastShift.clock_out) {
        pills.push('no clock-out');
      }
      if (Number(d.lastShift.total_income) === 0 && !d.lastShift.is_open) pills.push('no income recorded');
      if (pills.length) {
        kids.push(el('div', { style: 'margin-top:7px' },
          pills.map(t => el('span', { class: 'pill warn', style: 'margin-right:6px', text: t }))));
      }
      if (d.prevShift) {
        // The previous shift becomes the mark to drive at rather than a line of
        // grey text. Named at both ends so a morning's $34 against yesterday's
        // $136 reads as "so far", not as a bad day.
        const pd = parseDay(d.prevShift.shift_date);
        kids.push(compareMeter(
          d.lastShift.total_income, d.prevShift.total_income,
          isToday ? 'today so far' : 'this shift',
          DAYS[pd.getDay()].slice(0, 3) + ' ' + shortDay(d.prevShift.shift_date)));
      }
      out.push(card(kids));
    } else {
      out.push(card([K('Last shift'), V('—'), S('No shifts recorded yet')]));
    }

    // ---- this week ------------------------------------------------------
    // Compared against the same elapsed days of last week. A partial week beside
    // a finished one always reads as a collapse.
    const w = d.week;
    const weekLead = Number(w.income) > 0;
    out.push(card([
      K('This week so far'),
      V(weekLead ? money(w.income) : '—'),
      S(weekLead
        ? 'Day ' + w.dayOfWeek + ' of 7  ·  ' + plural(w.shifts, 'shift')
        : 'Day ' + w.dayOfWeek + ' of 7  ·  no shifts yet'),
      deltaLine('Same days last week', w.prior.income, w.delta, w.prior.shifts),
      // The same money again, as a shape. The total says how much; this says
      // which day went wrong, which is the thing he can act on tomorrow.
      (d.weekDays && d.weekDays.length > 1) ? weekChart(d.weekDays) : null
    ].filter(Boolean)));

    // ---- this month -----------------------------------------------------
    const m = d.month;
    out.push(card([
      K(d.monthName + ' so far'),
      V(Number(m.income) > 0 ? money(m.income) : '—'),
      S('Day ' + m.dayOfMonth + ' of ' + m.daysInMonth + '  ·  ' + plural(m.shifts, 'shift')),
      // Already like for like - the API measures the prior month over the same
      // elapsed days - so this one can be drawn without any caveat.
      Number(m.prior.shifts) > 0
        ? compareMeter(m.income, m.prior.income, d.monthName + ' so far', 'same days last month',
            deltaLine('Same days last month', m.prior.income, m.delta, m.prior.shifts))
        : deltaLine('Same days last month', m.prior.income, m.delta, m.prior.shifts)
    ]));

    // ---- per shift ------------------------------------------------------
    // The honest rate. Every shift row exists and every income record is attached
    // to one, so this figure has no denominator that can go missing - unlike an
    // hourly rate, which breaks on any shift with no clock-out.
    const ps = d.perShift;
    // Ten, not four. At four one good day moves the headline by a fifth - September
    // reads $83.70, or $70.19 without its single best shift - while the stable
    // 82-shift figure gets demoted to grey text underneath.
    const showMonth = ps.monthShifts >= 10 && ps.month !== null;
    out.push(card([
      K('Per shift'),
      V(showMonth ? money(ps.month) : money(ps.allTime)),
      S(showMonth
        ? 'from ' + plural(ps.monthShifts, 'shift') + ' in ' + d.monthName
        : 'across all ' + plural(ps.allShifts, 'shift')),
      // Two settled averages, so the comparison is fair in both directions.
      showMonth
        ? compareMeter(ps.month, ps.allTime, d.monthName, 'all ' + ps.allShifts + ' shifts')
        : null
    ]));

    // ---- per hour clocked in --------------------------------------------
    // One rate, labelled with exactly what it divides, and gated: below the floors
    // it says so rather than printing a number. It divides only income from shifts
    // that recorded hours, so a missed clock-out cannot inflate it.
    const ph = d.perHour;
    out.push(card(ph.rate !== null ? [
      K('Per hour clocked in'),
      V(money(ph.rate)),
      S(ph.hours.toFixed(1) + ' hours across the ' + ph.shiftsWithHours + ' of ' +
        ph.shifts + ' shifts with a clock-out'),
      // Not a comparison but a proportion: how much of the money this rate speaks
      // for. The bar turns green only once it covers nearly all of it, because a
      // confident-looking rate over half the earnings is the trap this card exists
      // to avoid.
      shareMeter(ph.coverage, 'Covers ' + money0(ph.incomeWithHours) + ' of the ' +
        money0(ph.income) + ' earned — ' + ph.coverage + '% of it')
    ] : [
      K('Per hour clocked in'),
      V('—'),
      S('Not enough time recorded to say'),
      T('Only ' + ph.coverage + '% of earnings sit on a shift with hours')
    ]));

    // ---- where the money comes from --------------------------------------
    // Per delivery, never per hour: DoorDash time is the whole dash and Uber time
    // is per delivery, so an hourly comparison between them is two clocks.
    const src = (d.bySource || []).filter(b => Number(b.deliveries) > 0);
    if (src.length) {
      const kids = [K('Where the money comes from')];
      if (d.scope && d.scope.since) {
        kids.push(S('Everything since ' + withYear(d.scope.since)));
      }
      // One stacked bar carries the split at a glance; the per-delivery rate still
      // gets a line each, because that is the only fair cross-service comparison
      // and no bar can say it.
      const chart = sourceChart(src);
      if (chart) {
        kids.push(chart);
        kids.push(el('div', { class: 'chart-legend' }, src.map((b, i) =>
          el('span', {}, [el('i', { style: 'background:var(--src' + (i + 1) + ')' }),
                          document.createTextNode(b.source)]))));
      }
      for (const b of src) {
        kids.push(el('div', { class: 'thin', style: 'margin-top:6px',
          text: b.source + ': ' + money0(b.income) + '  ·  ' + money(b.perDelivery) + ' each across ' +
                plural(b.deliveries, 'delivery').replace('deliverys', 'deliveries') }));
      }
      out.push(card(kids));
    }

    // ---- last 6 months ---------------------------------------------------
    // Drawn on a generated calendar axis. A month with no records shows as an
    // empty slot saying so: dropping it would put May next to July and turn a
    // nine-week stop into a smooth decline, and drawing it as $0 would claim he
    // earned nothing when in truth nothing was entered.
    const ms = d.months || [];
    if (ms.length) {
      const since = d.scope && d.scope.since;
      const cur = ms.find(x => x.current);
      out.push(chartCard('Last 6 months',
        cur && cur.income !== null
          ? d.monthName + ' is still running — ' + plural(cur.shifts, 'shift') + ' so far'
          : null,
        monthsChart(ms, since)));

      // Earned per hour, which is the number that actually moves, and the one
      // thing a column of monthly totals cannot show you the direction of.
      const rate = rateChart(ms);
      if (rate) {
        out.push(chartCard('Earned per hour',
          'By month, across every hour clocked in', rate));
      }
    }

    // ---- costs ------------------------------------------------------------
    // No net profit anywhere. Nothing is logged for tolls, tyres, maintenance,
    // insurance or tax, so income minus the food and charging that happened to be
    // recorded is not profit, it is income wearing a better label.
    const c = d.costs || {};
    const costKids = [K('Costs in ' + d.monthName)];
    if (Number(c.month) > 0) {
      costKids.push(V(money(c.month)));
      costKids.push(S(c.categories.map(x => x.type.toLowerCase()).join(', ')));
    } else {
      costKids.push(V('—'));
      costKids.push(S('Nothing logged this month'));
    }
    if (c.chargingDaysAgo !== null && c.chargingDaysAgo > 30) {
      costKids.push(T('Last charging cost was ' + c.chargingDaysAgo + ' days ago, ' + shortDay(c.lastCharging)));
    }
    out.push(card(costKids));

    // ---- scope -------------------------------------------------------------
    // The word "total" appears nowhere on this page. It would be wrong by $41,359.
    const sc = d.scope || {};
    const foot = el('div', { class: 'foot' });
    if (sc.since) {
      foot.append(el('div', { text:
        'Since shift tracking began, ' + withYear(sc.since) + ' — ' +
        money(sc.income) + ' across ' + plural(sc.shifts, 'shift') + '.' }));
    }
    if (sc.excluded) {
      foot.append(el('div', { text:
        'Earlier records, not counted above: ' + money0(sc.excluded.income) + ' (' +
        sc.excluded.records + ' records, ' + withYear(sc.excluded.from) + ' to ' +
        withYear(sc.excluded.to) + ').' }));
    }
    out.push(foot);

    $('#app').replaceChildren(...out.filter(Boolean));
  }

  (async () => {
    try {
      const r = await fetch('/api/records/dashboard');
      if (r.status === 401) { location.href = '/login.html'; return; }
      const data = await r.json();
      if (!r.ok) throw new Error(data.error || 'Request failed (' + r.status + ')');
      render(data);
    } catch (e) {
      // A page of zeroes would be indistinguishable from a very bad week.
      $('#app').replaceChildren(card([
        K('Cannot reach Patforce'),
        V('—'),
        S(e.message),
        el('div', { style: 'margin-top:10px' }, el('a', { href: '/records', text: 'Open the records →' }))
      ]));
    }
  })();
})();
</script>
</body>
</html>
