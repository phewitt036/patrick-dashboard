<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Patforce</title>
<link rel="icon" href="/favicon.svg">
<style>
  /* Light, deliberately. The command centre is dark because it is a wall of
     live telemetry read at a glance; this is a ledger, read closely, for a long
     time, often in daylight in a car. Different job, different surface.

     No webfont. system-ui is SF Pro on the phone and Segoe on x8 — sharper than
     anything a CDN would send, it renders on the first paint instead of the
     second, and it still works when the Pi has no internet. Numbers get a mono
     stack so columns of money line up. */
  :root {
    --bg:        #f4f5f7;
    --surface:   #ffffff;
    --surface2:  #f0f2f5;
    --border:    #e4e7ec;
    --border-2:  #d0d5dd;
    /* Referenced by .card, .child and .rpt-table borders; was never defined, so
       every one of those borders fell back to the text colour. */
    --line:      #e4e7ec;
    --text:      #0f1219;
    --muted:     #5b6472;
    --dim:       #98a1af;
    --accent:    #4f46e5;
    --accent-lo: #eef0fe;
    --pos:       #0a7a4f;
    --pos-lo:    #e6f5ee;
    --neg:       #b3341d;
    --neg-lo:    #fdeeea;
    --warn:      #8a5a00;
    --warn-lo:   #fdf3e0;
    --ring:      0 0 0 3px rgba(79,70,229,0.18);
    --shadow:    0 1px 2px rgba(16,24,40,0.05);
    --shadow-lg: 0 12px 32px rgba(16,24,40,0.14), 0 2px 6px rgba(16,24,40,0.06);
    --ui:  system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--ui);
    font-size: 14px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    -webkit-text-size-adjust: 100%;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* The same amber front door as the dashboard, so moving between the two does
     not feel like moving between two apps. The blur is dropped with the
     translucency: a gradient seen through a backdrop filter bands on Android. */
  header {
    position: sticky; top: 0; z-index: 20;
    background: linear-gradient(180deg, #b45309 0%, #c2620a 100%);
  }
  .head-row {
    max-width: 1180px; margin: 0 auto;
    display: flex; align-items: center; gap: 14px;
    padding: 14px 20px 12px;
  }
  h1 {
    font-size: 19px; font-weight: 640; margin: 0;
    letter-spacing: -0.021em; color: #fff;
  }
  /* The mark is amber-on-cream, so on the amber header it needs its own plate. */
  h1 .mark { background: #fffbeb; padding: 2px; }
  /* The app mark, beside the name on every page. Sized from the heading so it
     tracks the smaller phone title without a second rule. */
  h1 .mark {
    width: 1.15em; height: 1.15em; vertical-align: -0.22em;
    margin-right: 8px; border-radius: 26%;
  }

  .back { font-size: 13px; color: var(--muted); }
  .back:hover { color: var(--text); text-decoration: none; }
  /* Inherits the h1's weight and colour, so it reads as the wordmark, not a link -
     but it is a 44px-tall tap target on a phone, which is the point. */
  /* Stays inline-block, not flex: .mark positions itself with vertical-align,
     which a flex container would stop applying. Padding does the tap target. */
  .home { color: inherit; text-decoration: none; display: inline-block; padding: 10px 0; }
  .home:hover { text-decoration: none; }
  .home:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }
  .spacer { flex: 1; }

  /* Segmented control rather than three loose buttons: one object with a
     selected part reads as a switch, which is what it is. */
  .tabs {
    display: inline-flex; gap: 2px;
    max-width: 1180px; margin: 0 auto; padding: 0 20px 12px;
  }
  .tabs { display: flex; flex-wrap: wrap; row-gap: 6px; }
  .tab {
    font-family: inherit; font-size: 13px; font-weight: 500;
    background: none; border: 1px solid transparent; color: var(--muted);
    padding: 7px 15px; border-radius: 8px; cursor: pointer;
    min-height: 34px; transition: background 0.12s, color 0.12s;
  }
  /* Full white either way rather than a dimmed white: a faded tab label on amber
     falls under 4.5:1, so the selected state is carried by the white pill and the
     colour flip, not by fading the others out. */
  .tab { color: #fff; }
  .tab:hover { color: #fff; background: rgba(255,255,255,.16); }
  .tab[aria-selected="true"] {
    background: #fff; border-color: transparent;
    color: #b45309; box-shadow: var(--shadow); font-weight: 600;
  }

  main { max-width: 1180px; margin: 0 auto; padding: 20px; }

  .bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; margin-bottom: 16px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label {
    font-size: 11px; font-weight: 560; letter-spacing: 0.02em; color: var(--muted);
  }
  input, select, textarea {
    font-family: inherit; font-size: 14px;
    background: var(--surface); color: var(--text);
    border: 1px solid var(--border-2); border-radius: 8px;
    padding: 8px 11px; min-height: 38px;
    box-shadow: var(--shadow);
    transition: border-color 0.12s, box-shadow 0.12s;
  }
  input::placeholder { color: var(--dim); }
  input:focus, select:focus, textarea:focus {
    outline: none; border-color: var(--accent); box-shadow: var(--ring);
  }
  button:focus-visible { outline: none; box-shadow: var(--ring); }
  input[type="date"] { min-width: 148px; }
  input[type="search"] { max-width: 320px; }
  input[type="number"] { font-variant-numeric: tabular-nums; }
  /* The box styling above is for text fields; a tick box keeps its own. */
  input[type="checkbox"] {
    width: 20px; height: 20px; padding: 0; margin: 0; border: 0; box-shadow: none;
    flex: none; accent-color: var(--accent, #2563eb); cursor: pointer;
  }

  button {
    font-family: inherit; font-size: 13px; font-weight: 540; cursor: pointer;
    border-radius: 8px; padding: 9px 14px; min-height: 38px;
    border: 1px solid var(--border-2); background: var(--surface); color: var(--text);
    box-shadow: var(--shadow); transition: background 0.12s, border-color 0.12s;
  }
  button:hover { background: var(--surface2); }
  button:disabled { opacity: 0.5; cursor: default; }
  .primary {
    background: var(--accent); border-color: var(--accent); color: #fff;
    box-shadow: 0 1px 2px rgba(79,70,229,0.28);
  }
  .primary:hover { background: #4338ca; border-color: #4338ca; }

  /* Scoped to the header only - .primary is the Save button inside the dialogs
     too, and those still sit on white. */
  header button {
    background: rgba(255,255,255,.16); border-color: rgba(255,255,255,.3);
    color: #fff; box-shadow: none;
  }
  header button:hover { background: rgba(255,255,255,.26); }
  header .primary {
    background: #fff; border-color: #fff; color: #b45309; font-weight: 600;
  }
  header .primary:hover { background: #fffbeb; border-color: #fffbeb; }
  header .back, header .home { color: #fff; }
  #find { margin: 0; }
  #find input {
    width: 220px;
    background: rgba(255,255,255,.16); border-color: rgba(255,255,255,.3); color: #fff;
  }
  #find input::placeholder { color: rgba(255,255,255,.78); }
  #find input:focus { background: #fff; color: var(--text); }
  .danger {
    color: var(--muted); border-color: transparent; background: none;
    padding: 5px 9px; min-height: 0; box-shadow: none; font-size: 13px;
  }
  .danger:hover { background: var(--neg-lo); color: var(--neg); }
  .link-btn {
    background: none; border: none; color: var(--muted); padding: 5px 9px;
    min-height: 0; box-shadow: none;
  }
  .link-btn:hover { background: var(--surface2); color: var(--text); }

  /* Stat tiles. The number is the thing; the label is a caption under it. */
  .summary {
    display: flex; flex-wrap: wrap; gap: 8px;
    margin-bottom: 14px; padding: 0; border: none; background: none;
  }
  .summary span {
    flex: 0 1 auto; min-width: 148px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; box-shadow: var(--shadow);
    padding: 12px 14px;
    font-size: 12px; color: var(--muted); font-weight: 500;
  }
  .summary b {
    display: block; margin-bottom: 1px;
    color: var(--text); font-family: var(--mono);
    font-size: 21px; font-weight: 600; letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
  }

  /* Reporting */
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 16px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px;
          --tone: var(--accent); --tone-lo: var(--accent-lo); }
  /* Same tone set as the dashboard, so a card means the same thing on both pages. */
  .t-amber  { --tone: #b45309; --tone-lo: #fdf3e0; }
  .t-indigo { --tone: #4f46e5; --tone-lo: #eef0fe; }
  .t-violet { --tone: #6d28d9; --tone-lo: #f1ecfe; }
  .t-teal   { --tone: #0f766e; --tone-lo: #e3f3f1; }
  .t-green  { --tone: #0a7a4f; --tone-lo: #e6f5ee; }
  .t-rose   { --tone: #b3341d; --tone-lo: #fdeeea; }
  .card-head { display: flex; align-items: center; gap: 8px; }
  .card .chip { width: 26px; height: 26px; border-radius: 7px; flex: none;
                background: var(--tone-lo); color: var(--tone);
                display: grid; place-items: center; }
  .card .chip svg { width: 15px; height: 15px; stroke: currentColor; fill: none;
                    stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .card .k { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--tone); }
  .card .v { font-size: 20px; font-weight: 700; margin-top: 4px; }
  .card .s { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .rpt-h { font-size: 13px; font-weight: 700; margin: 18px 0 8px; }
  .rpt-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .rpt-table th, .rpt-table td { padding: 7px 10px; border-bottom: 1px solid var(--line); text-align: left; }
  .rpt-table th.num, .rpt-table td.num { text-align: right; }
  .thin { color: var(--muted); font-size: 11px; }
  .grain { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .grain button[aria-pressed="true"] { background: var(--accent, #2563eb); color: #fff; }
  tr.tappable { cursor: pointer; }
  tr.tappable:hover { background: var(--surface2); }
  /* Read-only detail */
  .kv { display: grid; grid-template-columns: minmax(120px, 40%) 1fr; gap: 6px 14px; font-size: 13px; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; font-variant-numeric: tabular-nums; }
  .child { border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; margin-top: 7px; cursor: pointer; }
  .child:hover { background: var(--surface2); }
  .child .top { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; }
  .table-wrap {
    overflow-x: auto;
    border: 1px solid var(--border); border-radius: 12px;
    background: var(--surface); box-shadow: var(--shadow);
  }
  table { border-collapse: collapse; width: 100%; min-width: 760px; }
  thead th {
    position: sticky; top: 0; z-index: 1;
    background: var(--surface2);
    text-align: left; font-weight: 600; font-size: 11px;
    letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted);
    padding: 10px 14px; border-bottom: 1px solid var(--border); white-space: nowrap;
  }
  td {
    padding: 11px 14px; border-bottom: 1px solid var(--border);
    white-space: nowrap; color: var(--text);
  }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: #fafbfc; }
  .num { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .rec { color: var(--dim); font-family: var(--mono); font-size: 12px; }
  .clip {
    display: inline-block; max-width: 22ch; vertical-align: bottom;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  td.plat { white-space: normal; }
  td.plat .pill { white-space: nowrap; margin-top: 2px; }
  .pill.level { background: transparent; border-color: var(--border); }
  .search-field { flex: 1 1 240px; max-width: 420px; }
  .search-field input { max-width: none; }
  .muted { color: var(--muted); }

  .pill {
    display: inline-block; font-size: 11px; font-weight: 560; letter-spacing: 0.01em;
    padding: 2px 8px; border-radius: 999px;
    background: var(--surface2); color: var(--muted);
    border: 1px solid transparent;
  }
  /* The same three service colours the dashboard uses. They were indigo and red
     here, which made DoorDash red on one screen and green on the other, and gave
     Uber and Uber Eats the same colour despite being separate rows everywhere. */
  /* Service identity in the income list. Two steps of each hue: the bright one
     the dashboard validated for colour-vision deficiency draws the bar, and a
     darker ink sits behind the chip's white initials, because the bright green
     and orange only manage 2.7:1 and 3.1:1 against white text. */
  .src-uber  { --src: #2a78d6; --src-ink: #1f6fc4; }
  .src-eats  { --src: #eb6834; --src-ink: #b24a1c; }
  .src-dd    { --src: #1baf7a; --src-ink: #0f7355; }
  .src-other { --src: #98a1af; --src-ink: #5b6472; }
  .src { display: inline-flex; align-items: center; gap: 7px; font-weight: 560; white-space: nowrap; }
  .src-chip {
    width: 24px; height: 24px; border-radius: 7px; flex: none;
    background: var(--src-ink); color: #fff;
    display: grid; place-items: center;
    font-size: 9.5px; font-weight: 800; letter-spacing: .02em;
  }
  /* The trip as a bar under its total: paid in full colour, tip a lighter step of
     the same colour, a 2px gap between them. Right-aligned under a right-aligned
     number so the two read as one figure. */
  .trip-track {
    display: flex; gap: 2px; height: 6px; width: 92px; margin: 6px 0 0 auto;
    border-radius: 3px; background: var(--surface2); overflow: hidden;
  }
  .trip-track i { display: block; height: 100%; border-radius: 3px; background: var(--src); }
  .trip-track .tip { opacity: .4; }
  /* An axis break: a 2px gap cut near the end of a bar that runs off the scale,
     the way a chart marks a bar too long to draw. */
  .trip-track.capped {
    -webkit-mask: linear-gradient(90deg, #000 calc(100% - 9px), transparent calc(100% - 9px),
                                  transparent calc(100% - 6px), #000 calc(100% - 6px));
            mask: linear-gradient(90deg, #000 calc(100% - 9px), transparent calc(100% - 9px),
                                  transparent calc(100% - 6px), #000 calc(100% - 6px));
  }
  .pill.uber { background: #e8f1fc; color: #1f6fc4; }
  .pill.eats { background: #fdeee7; color: #b24a1c; }
  .pill.dd   { background: #e3f3ef; color: #0f7355; }
  .pill.open { background: var(--pos-lo);    color: var(--pos); }
  .pill.warn { background: var(--warn-lo);   color: var(--warn); }

  .empty { padding: 52px 20px; text-align: center; color: var(--muted); }

  /* modal */
  dialog {
    border: 1px solid var(--border); border-radius: 14px;
    background: var(--surface); color: var(--text);
    padding: 0; width: min(560px, calc(100vw - 32px));
    box-shadow: var(--shadow-lg);
  }
  dialog::backdrop { background: rgba(15,18,25,0.32); backdrop-filter: blur(2px); }
  .dlg-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 20px; border-bottom: 1px solid var(--border);
  }
  .dlg-head h2 { font-size: 16px; font-weight: 620; margin: 0; letter-spacing: -0.015em; }
  .dlg-body { padding: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  #detail-body { display: block; }
  /* [open] matters. A bare #detail { display: flex } overrides the browser rule
     that hides a closed dialog, so after the first Close it stayed on the page
     with no backdrop, sitting over the table in normal flow. */
  #detail[open] {
    /* Never taller than the screen: long shifts scroll inside the dialog
       rather than making the page itself scroll behind it. */
    max-height: min(86vh, 900px);
    display: flex; flex-direction: column;
  }
  #detail .dlg-head { flex: 0 0 auto; }
  #detail-body { overflow-y: auto; -webkit-overflow-scrolling: touch; }
  #detail .dlg-head { display: flex; align-items: center; gap: 10px; }
  #detail .dlg-head h2 { flex: 1; min-width: 0; font-size: 15px; }
  .dlg-body .full { grid-column: 1 / -1; }
  .dlg-foot {
    display: flex; gap: 10px; justify-content: flex-end;
    padding: 14px 20px; border-top: 1px solid var(--border); background: var(--surface2);
    border-radius: 0 0 13px 13px;
  }
  .err {
    grid-column: 1 / -1; color: var(--neg); font-size: 13px;
    background: var(--neg-lo); border: 1px solid #f5c9be;
    border-radius: 8px; padding: 10px 12px;
  }
  .hint { font-size: 11px; color: var(--dim); }

  /* Dark on light: a toast has to read as an overlay, not another card. */
  #toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(6px);
    background: #10131a; border: 1px solid #10131a; color: #fff;
    border-radius: 10px; padding: 11px 18px; font-size: 13px; font-weight: 500;
    opacity: 0; pointer-events: none;
    transition: opacity 0.18s ease, transform 0.18s ease;
    z-index: 40; max-width: calc(100vw - 32px); box-shadow: var(--shadow-lg);
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast.bad { background: var(--neg); border-color: var(--neg); }

  #filter-toggle { display: none; }

  html, body { max-width: 100%; overflow-x: hidden; }
  .rpt-table-wrap { overflow-x: auto; }

  @media (max-width: 640px) {
    /* Tabs are the navigation; on a phone they wrap onto two rows so every one
       of them is reachable without dragging. */
    /* Most columns are hidden at this width, so the 760px floor only buys a
       sideways scroll across empty space. The visible columns fit exactly. */
    #tbl { min-width: 0; }
    #tbl :is(th, td) { white-space: normal; padding-left: 10px; padding-right: 10px; }
    .tabs { padding-left: 12px; padding-right: 12px; }
    .tab { padding: 7px 11px; font-size: 12.5px; }
    .cards { grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: 8px; }
    .card { padding: 10px 11px; }
    .card .v { font-size: 17px; }
    /* A two-column definition list is unreadable at this width. */
    .kv { grid-template-columns: 1fr; gap: 2px 0; }
    .kv dt { margin-top: 8px; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
    .kv dd { font-size: 14px; }
    .child .top { flex-wrap: wrap; }

    /* Report tables stack into label/value rows. A five-column table cannot fit
       375px, and clipping it silently loses the per-hour figure. */
    /* The rows are blocks, but a display:table parent still sizes itself from
       the original cell widths and overflows. The whole table has to collapse. */
    /* The page-wide table rules set a 760px min-width and nowrap cells, which
       is right for the record grid in its scrolling box and fatal for a table
       meant to stack. Both are undone here, not globally. */
    .rpt-table { display: block; width: 100%; min-width: 0; }
    .rpt-table td { white-space: normal; }
    .rpt-table tbody { display: block; width: 100%; }
    .rpt-table thead { display: none; }
    .rpt-table tr { display: block; padding: 6px 0; border-bottom: 1px solid var(--line); }
    .rpt-table tr:last-child { border-bottom: 0; }
    .rpt-table td {
      display: flex; align-items: baseline; justify-content: flex-end; gap: 8px;
      border: 0; padding: 3px 2px; text-align: right;
    }
    .rpt-table td::before {
      content: attr(data-label);
      color: var(--muted); font-size: 11px; text-transform: uppercase;
      letter-spacing: .05em; text-align: left; flex: 0 0 auto;
      /* Pushes every value to the right edge. Without it a cell holding both a
         figure and its coverage note spreads three items across the row and the
         figure stops lining up with the ones above it. */
      margin-right: auto;
    }
    .rpt-table td[data-label="Service"] { padding-bottom: 5px; }
    .rpt-table td .thin { display: inline; margin-left: 6px; }

    /* Weeks and Months carry eight columns each. The older tabs already drop
       their secondary ones at this width; these now do the same rather than
       scroll inside a box. */
    #tbl[data-tab="weeks"]  :is(th,td):nth-child(2),
    #tbl[data-tab="weeks"]  :is(th,td):nth-child(4),
    #tbl[data-tab="weeks"]  :is(th,td):nth-child(6),
    #tbl[data-tab="weeks"]  :is(th,td):nth-child(7),
    #tbl[data-tab="months"] :is(th,td):nth-child(2),
    #tbl[data-tab="months"] :is(th,td):nth-child(4),
    #tbl[data-tab="months"] :is(th,td):nth-child(6),
    #tbl[data-tab="months"] :is(th,td):nth-child(8) { display: none; }
  }

  @media (max-width: 640px) {
    .dlg-body { grid-template-columns: 1fr; }
    .bar .field { flex: 1 1 140px; }
    main { padding: 14px; }
    .summary span { flex: 1 1 calc(50% - 4px); padding: 10px 12px; }
    .summary b { font-size: 18px; }
    h1 { font-size: 17px; }
    .back { display: none; }
    /* The find box takes the room the hidden link and the spacer left. */
    .head-row .spacer { display: none; }
    #find { flex: 1 1 0; min-width: 0; }
    #find input { width: 100%; }
    input[type="search"] { max-width: none; }

    /* Records first. The filters are one tap away rather than a screenful in
       front of them. */
    #filter-toggle { display: inline-block; }
    #filters { display: none; }
    #filters.open { display: flex; }
    #filters button { flex: 0 0 auto; }
    #pager { justify-content: center; }

    /* Column priority. On a phone the money is what you came for, so the
       component columns that add up to it stand down. Nothing is lost - the
       full row is on any wider screen, and Edit opens all of it. */
    #tbl { min-width: 0; }
    #tbl[data-tab="income"]   :is(th,td):nth-child(3),
    #tbl[data-tab="income"]   :is(th,td):nth-child(4),
    #tbl[data-tab="income"]   :is(th,td):nth-child(5),
    #tbl[data-tab="income"]   :is(th,td):nth-child(6),
    #tbl[data-tab="income"]   :is(th,td):nth-child(8),
    #tbl[data-tab="income"]   :is(th,td):nth-child(9),
    #tbl[data-tab="income"]   :is(th,td):nth-child(10),
    #tbl[data-tab="expenses"] :is(th,td):nth-child(3),
    #tbl[data-tab="expenses"] :is(th,td):nth-child(5),
    #tbl[data-tab="expenses"] :is(th,td):nth-child(6),
    #tbl[data-tab="shifts"]   :is(th,td):nth-child(2),
    #tbl[data-tab="shifts"]   :is(th,td):nth-child(3),
    #tbl[data-tab="shifts"]   :is(th,td):nth-child(6),
    #tbl[data-tab="shifts"]   :is(th,td):nth-child(9),
    #tbl[data-tab="shifts"]   :is(th,td):nth-child(10) { display: none; }
    td, thead th { padding-left: 8px; padding-right: 8px; }
    td { font-size: 13px; }
    .rec { font-size: 11px; }

    /* The platform's name made the column wide enough to push the date onto
       three lines and double every row's height. The chip's colour and initials
       already say which service it is, so on a phone the name is kept for screen
       readers only and the date holds to one line. */
    .src-label {
      position: absolute; width: 1px; height: 1px; overflow: hidden;
      clip: rect(0 0 0 0); white-space: nowrap;
    }
    #tbl[data-tab="income"] td:first-child { white-space: nowrap; }

    /* Delete stands down on a phone. It is the one irreversible thing on this
       page, the target is small, and it is not what anyone opens this for in a
       car — it is still there on any wider screen, and Edit is one tap away. */
    td .danger { display: none; }
    td .link-btn { padding: 4px 8px; }

    /* Shifts carry more numbers than a phone can show; these are the four that
       answer "was that shift worth it". */
    #tbl[data-tab="shifts"] :is(th,td):nth-child(4),
    #tbl[data-tab="shifts"] :is(th,td):nth-child(7) { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<header>
  <div class="head-row">
    <!-- The wordmark is the way home. The "← dashboard" link beside it is hidden
         under 640px, and Patforce is installed as a standalone PWA, so on a phone
         there is no browser back button either - which left no way back to the
         dashboard at all once you reached Records. The logo costs no header space. -->
    <h1><a class="home" href="/" aria-label="Back to the dashboard"><svg class="mark" viewBox="0 0 512 512" aria-hidden="true" focusable="false">
      <rect width="512" height="512" rx="112" fill="#d97706"/>
      <g fill="#fffbeb">
        <rect x="122" y="252" width="68" height="120" rx="16"/>
        <rect x="222" y="182" width="68" height="190" rx="16"/>
        <rect x="322" y="112" width="68" height="260" rx="16"/>
      </g>
    </svg>Patforce</a></h1>
    <a class="back" href="/">&larr; dashboard</a>
    <span class="spacer"></span>
    <!-- Find any record from any tab: a number opens it, anything else lists the
         matches across income, expenses, shifts and weeks. -->
    <form id="find" role="search" autocomplete="off">
      <input type="search" id="find-q" placeholder="Find a record…" enterkeyhint="search"
             aria-label="Find any record by number, amount, date or text">
    </form>
    <button id="filter-toggle" aria-expanded="false" aria-controls="filters">Filters</button>
    <button class="primary" id="add-btn">+ Add</button>
  </div>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="income" aria-selected="true">Income</button>
    <button class="tab" role="tab" data-tab="expenses" aria-selected="false">Expenses</button>
    <button class="tab" role="tab" data-tab="shifts" aria-selected="false">Shifts</button>
    <button class="tab" role="tab" data-tab="weeks" aria-selected="false">Weeks</button>
    <button class="tab" role="tab" data-tab="months" aria-selected="false">Months</button>
    <button class="tab" role="tab" data-tab="report" aria-selected="false">Report</button>
  </div>
</header>

<main>
  <div class="bar" id="filters"></div>
  <div class="summary" id="summary"></div>
  <div class="bar" id="bulk" style="margin-top:10px" hidden></div>
  <div id="report" hidden></div>
  <div class="table-wrap" id="table-wrap"><table id="tbl"><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>
  <div class="bar" style="margin-top:14px" id="pager"></div>
</main>

<dialog id="dlg">
  <form method="dialog" id="form">
    <div class="dlg-head"><h2 id="dlg-title">Add</h2><button type="button" id="dlg-x" class="link-btn">Close</button></div>
    <div class="dlg-body" id="dlg-body"></div>
    <div class="dlg-foot">
      <button type="button" id="cancel">Cancel</button>
      <button type="button" class="primary" id="save">Save</button>
    </div>
  </form>
</dialog>

<dialog id="detail">
  <div class="dlg-head">
    <button type="button" id="detail-back" class="link-btn" hidden>&larr; Back</button>
    <h2 id="detail-title">Record</h2>
    <button type="button" id="detail-x" class="link-btn">Close</button>
  </div>
  <div class="dlg-body" id="detail-body"></div>
</dialog>

<div id="toast"></div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const el = (t, a = {}, kids = []) => {
    const n = document.createElement(t);
    for (const [k, v] of Object.entries(a)) {
      if (k === 'text') n.textContent = v;
      else if (k === 'html') n.innerHTML = v;
      else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
      else if (v !== null && v !== undefined) n.setAttribute(k, v);
    }
    for (const c of [].concat(kids)) if (c) n.append(c);
    return n;
  };

  /** Earned money, but has no recorded hours to divide it by. */
  const needsHours = r =>
    !r.is_open && r.clock_out && Number(r.shift_hours) === 0 && Number(r.total_income) > 0;

  const money = v => (v === null || v === undefined) ? '—'
    : '$' + Number(v).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const numOrDash = (v, d = 1) => (v === null || v === undefined || v === '') ? '—' : Number(v).toFixed(d);
  // Four digits of record count read as a year without a separator.
  const count = v => Number(v).toLocaleString('en-US');
  const dayName = s => (s || '').replace(/^\d+\.\s*/, '');
  // A datetime-local input has no zone; the browser's own offset is the right
  // one, because Patrick is standing where the shift happened.
  const toLocalInput = iso => {
    if (!iso) return '';
    const d = new Date(iso);
    const p = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
  };
  const fromLocalInput = v => v ? new Date(v).toISOString() : null;

  let toastTimer;
  function toast(msg, bad) {
    const t = $('#toast');
    t.textContent = msg;
    t.className = 'show' + (bad ? ' bad' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.className = ''; }, bad ? 5000 : 2600);
  }

  async function api(method, path, body) {
    const r = await fetch('/api/records' + path, {
      method,
      headers: body ? { 'Content-Type': 'application/json' } : {},
      body: body ? JSON.stringify(body) : undefined
    });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.error || `Request failed (${r.status})`);
    return data;
  }

  // Arriving from the dashboard's fix-it row, which links to a specific tab and
  // filter. Without this the link lands on Income and he has to go hunting for
  // the thing the row just told him about.
  const startup = new URLSearchParams(location.search);
  const startTab = ['income', 'expenses', 'shifts', 'weeks', 'months', 'report'].includes(startup.get('tab'))
    ? startup.get('tab') : 'income';
  const startFilter = {};
  if (startup.get('needs') === 'clockout') startFilter.needsClockOut = '1';
  for (const k of ['from', 'to', 'source', 'type', 'q', 'ride', 'level', 'bonus']) {
    if (startup.get(k)) startFilter[k] = startup.get(k);
  }

  const state = { tab: startTab, meta: null, filter: startFilter, offset: 0, limit: 50, editing: null };

  // -------------------------------------------------------------- tab config
  // Coverage is how much of a period's money actually has time recorded against
  // it. Most of the imported history has no Time_Taken, so an hourly rate drawn
  // from a thin slice is shown as thin rather than presented as fact.
  const coverageNote = c =>
    c >= 90 ? '' : c > 0 ? ` (${c}% timed)` : ' (no times recorded)';

  // Small tags beside the platform, so airport and reserved rides can be picked
  // out of the list at a glance.
  // The Uber level comes first and outlined, so the product (UberX, Comfort) reads
  // apart from how the ride was booked or where it went.
  const rideTags = r => [
    r.uber_level ? el('span', { class: 'pill level', style: 'margin-left:4px', text: r.uber_level }) : null,
    r.is_airport ? el('span', { class: 'pill', style: 'margin-left:4px', text: 'Airport' }) : null,
    r.is_reservation ? el('span', { class: 'pill', style: 'margin-left:4px', text: 'Reserved' }) : null
  ].filter(Boolean);

  // A free-text cell that cannot widen the table. Cells never wrap, so one long
  // store - "Jason's Deli (6020 Long Prairie Rd)", INC-1738 - pushed page 4 past
  // the window and gave it a sideways scrollbar page 1 did not have. Cut short
  // with an ellipsis; the whole text is on hover, and in the record's detail.
  const clipCell = (text, cls = '') => text
    ? el('td', { class: cls }, el('span', { class: 'clip', title: text, text }))
    : el('td', { class: 'muted', text: '—' });

  const TABS = {
    income: {
      columns: ['Date', 'Platform', 'Store', 'Base', 'Tips', 'Bonus', 'Total', 'Miles', 'Mins', 'Shift', ''],
      load: () => {
        const p = new URLSearchParams({ limit: state.limit, offset: state.offset });
        for (const [k, v] of Object.entries(state.filter)) if (v) p.set(k, v);
        return api('GET', '/income?' + p);
      },
      // The bars scale to the page's 90th-percentile trip, not its biggest. The
      // biggest is routinely not a trip at all - INC-1721 is a $150 Quest bonus -
      // or a 250-mile airport run, and scaling to it shrank every ordinary $8-$30
      // delivery to a sliver. Anything above the scale draws full and is marked as
      // off it; the exact figure is printed above every bar either way.
      scale: rows => {
        const t = rows.map(r => Number(r.total_earnings) || 0).filter(v => v > 0).sort((a, b) => a - b);
        return t.length ? Math.max(1, t[Math.floor(0.9 * (t.length - 1))]) : 1;
      },
      row: r => el('tr', {}, [
        el('td', {}, [el('div', { text: r.income_date }), el('div', { class: 'rec', text: r.record_no })]),
        // The only cell allowed to wrap: with Airport and Reserved both ticked it is
        // the widest column, so the tags drop under the platform when the table
        // would otherwise run past the window.
        el('td', { class: 'plat' }, [
          // Uber Eats gets its own colour. startsWith('Uber') lumped it in with
          // rideshare, which is the one distinction this whole app turns on.
          el('span', { class: 'src ' + srcClass(r.source) }, [
            el('span', { class: 'src-chip', text: SRC_MARK[r.source] || r.source.slice(0, 2).toUpperCase() }),
            el('span', { class: 'src-label', text: r.source })
          ]),
          ...rideTags(r)
        ]),
        clipCell(r.store),
        el('td', { class: 'num', text: money(r.amount) }),
        el('td', { class: 'num', text: r.tips ? money(r.tips) : '—' }),
        el('td', { class: 'num', text: r.surge_bonus ? money(r.surge_bonus) : '—' }),
        el('td', { class: 'num' }, [
          el('div', { text: money(r.total_earnings) }),
          tripBar(r, state.pageMax)
        ]),
        el('td', { class: 'num', text: numOrDash(r.miles_driven) }),
        el('td', { class: 'num', text: numOrDash(r.time_taken_minutes) }),
        el('td', {}, r.shift_record_no
          ? el('span', { class: 'rec', text: r.shift_record_no })
          : el('span', { class: 'pill warn', text: 'unlinked' })),
        el('td', { class: 'num' }, [
          el('button', { class: 'link-btn', onclick: () => openForm('income', r), text: 'Edit' }),
          el('button', { class: 'danger', onclick: () => remove('income', r.id, r.record_no), text: 'Delete' })
        ])
      ]),
      // Two tiles for what the list holds, and a third only when the bulk
      // import is part of it - so the figure that agrees with the dashboard is
      // on screen beside the one that does not, rather than the two silently
      // contradicting each other on different tabs.
      summary: d => {
        const bits = [`${count(d.total)} record${d.total === 1 ? '' : 's'}`, `${money(d.sumEarnings)} earned`];
        const bulk = d.bulkImport;
        if (bulk && bulk.count) {
          bits.push(`${money(Number(d.sumEarnings) - Number(bulk.earnings))} counted in reports`);
          bits.push(`${count(bulk.count)} bulk-imported, not counted`);
        }
        // Averages of whatever is filtered - the answer to "what do these pay".
        const a = d.averages;
        if (a && a.records) {
          const each = state.filter.source === 'Uber' ? 'per ride' : 'per record';
          if (a.perRecord !== null) bits.push(`${money(a.perRecord)} avg ${each}`);
          if (a.perHour !== null) bits.push(`${money(a.perHour)} per trip hour`);
          if (a.perMile !== null) bits.push(`${money(a.perMile)} per mile`);
        }
        return bits;
      }
    },

    expenses: {
      columns: ['Date', 'Type', 'Store', 'Amount', 'Note', 'Shift', ''],
      load: () => {
        const p = new URLSearchParams({ limit: state.limit, offset: state.offset });
        for (const [k, v] of Object.entries(state.filter)) if (v) p.set(k, v);
        return api('GET', '/expenses?' + p);
      },
      row: r => el('tr', {}, [
        el('td', {}, [el('div', { text: r.expense_date }), el('div', { class: 'rec', text: r.record_no })]),
        el('td', {}, el('span', { class: 'pill', text: r.type || 'none' })),
        clipCell(r.store),
        el('td', { class: 'num', text: money(r.amount) }),
        clipCell(r.type_explanation, 'muted'),
        el('td', {}, r.shift_record_no
          ? el('span', { class: 'rec', text: r.shift_record_no })
          : el('span', { class: 'pill warn', text: 'unlinked' })),
        el('td', { class: 'num' }, [
          el('button', { class: 'link-btn', onclick: () => openForm('expenses', r), text: 'Edit' }),
          el('button', { class: 'danger', onclick: () => remove('expenses', r.id, r.record_no), text: 'Delete' })
        ])
      ]),
      summary: d => [`${d.total} expense${d.total === 1 ? '' : 's'}`, `${money(d.sumAmount)} spent`]
    },

    shifts: {
      columns: ['Date', 'In', 'Out', 'Hours', 'Income', 'Expenses', 'Net', '$/hr', 'Miles', 'Records', ''],
      load: async () => {
        const p = new URLSearchParams({ limit: 200 });
        for (const [k, v] of Object.entries(state.filter)) if (v && k !== 'source' && k !== 'type') p.set(k, v);
        const d = await api('GET', '/shifts?' + p);
        return { records: d.shifts, total: d.shifts.length };
      },
      row: r => el('tr', {}, [
        el('td', {}, [
          el('div', { text: r.shift_date }),
          el('div', { class: 'rec', text: `${r.record_no} · ${dayName(r.day_of_week)}` })
        ]),
        el('td', { class: 'muted', text: r.clock_in ? toLocalInput(r.clock_in).slice(11) : '—' }),
        el('td', {}, r.is_open
          ? el('span', { class: 'pill open', text: 'open' })
          : el('span', { class: 'muted', text: r.clock_out ? toLocalInput(r.clock_out).slice(11) : '—' })),
        // A shift that earned money across no recorded hours never got a
        // clock-out — the import closed it at its own clock-in rather than
        // inventing a duration Salesforce never had. Its income still counts
        // toward the weekly rate while its hours do not, so that rate reads
        // high until the real clock-out is filled in. Flagged so the ones that
        // need fixing can be found instead of scrolled for.
        el('td', { class: 'num' }, needsHours(r)
          ? el('span', { class: 'pill warn', text: 'no hours' })
          : el('span', { text: numOrDash(r.shift_hours, 2) })),
        el('td', { class: 'num', text: money(r.total_income) }),
        el('td', { class: 'num', text: money(r.total_expenses) }),
        el('td', { class: 'num', text: money(r.net_profit) }),
        el('td', { class: 'num', text: money(r.earnings_per_shift_hour) }),
        el('td', { class: 'num', text: numOrDash(r.total_shift_miles) }),
        el('td', { class: 'num muted', text: `${r.income_count} / ${r.expense_count}` }),
        el('td', { class: 'num' }, [
          el('button', { class: 'link-btn', onclick: () => openForm('shifts', r), text: 'Edit' }),
          el('button', { class: 'danger', onclick: () => remove('shifts', r.id, r.record_no), text: 'Delete' })
        ])
      ]),
      summary: d => [`${d.total} shift${d.total === 1 ? '' : 's'}`]
    }
  };

  // ------------------------------------------------------------------ render
  // On a phone the filter bar is a screenful of inputs standing between you and
  // your records, so it collapses behind this. Above 640px it is always open and
  // the toggle is not shown.
  $('#filter-toggle').addEventListener('click', () => {
    const bar = $('#filters');
    const open = bar.classList.toggle('open');
    $('#filter-toggle').setAttribute('aria-expanded', String(open));
  });

  TABS.weeks = {
    columns: ['Week', 'Days', 'Income', 'Expenses', 'Net', 'Shift hrs', 'Active hrs', '$/active hr'],
    detail: 'week',
    load: async () => {
      const p = new URLSearchParams({ limit: 60 });
      if (state.filter.q) p.set('q', state.filter.q);
      return { records: (await api('GET', '/weeks?' + p)).weeks };
    },
    row: w => el('tr', {}, [
      el('td', {}, [
        el('div', { text: w.start_date + '  to  ' + w.end_date }),
        el('div', { class: 'rec', text: w.record_no })
      ]),
      el('td', { class: 'num', text: String(w.days_worked) }),
      el('td', { class: 'num', text: money(w.weekly_total_income) }),
      el('td', { class: 'num', text: money(w.weekly_total_expenses) }),
      el('td', { class: 'num', text: money(w.net_profit) }),
      el('td', { class: 'num', text: numOrDash(w.weekly_shift_hours, 2) }),
      el('td', { class: 'num', text: numOrDash(w.weekly_active_hours, 2) }),
      el('td', { class: 'num', text: money(w.earnings_per_active_hour) })
    ]),
    summary: d => {
      const inc = d.records.reduce((a, w) => a + Number(w.weekly_total_income), 0);
      return [`${d.records.length} weeks`, `${money(inc)} total`];
    }
  };

  TABS.months = {
    columns: ['Month', 'Days', 'Income', 'Expenses', 'Net', 'Shift hrs', '$/shift hr', '$/active hr'],
    detail: 'month',
    load: async () => ({ records: (await api('GET', '/months?limit=36')).months }),
    row: m => el('tr', {}, [
      el('td', {}, [
        el('div', { text: m.month_label }),
        el('div', { class: 'rec', text: m.month_start + ' to ' + m.month_end })
      ]),
      el('td', { class: 'num', text: String(m.days_worked) }),
      el('td', { class: 'num', text: money(m.total_income) }),
      el('td', { class: 'num', text: money(m.total_expenses) }),
      el('td', { class: 'num', text: money(m.net_profit) }),
      el('td', { class: 'num', text: numOrDash(m.shift_hours, 2) }),
      el('td', { class: 'num', text: money(m.earnings_per_shift_hour) }),
      el('td', { class: 'num', text: money(m.earnings_per_active_hour) })
    ]),
    summary: d => {
      const inc = d.records.reduce((a, m) => a + Number(m.total_income), 0);
      const net = d.records.reduce((a, m) => a + Number(m.net_profit), 0);
      return [`${d.records.length} months`, `${money(inc)} income`, `${money(net)} net`];
    }
  };

  // "6 days worked" when a day held one shift each, "6 days worked · 9 shifts"
  // when some held two. The shift count is only shown when it differs, so the
  // caption stays short on the ordinary week.
  const daysLine = t => {
    const d = Number(t.days_worked), s = Number(t.shifts_worked);
    const days = d + ' day' + (d === 1 ? '' : 's') + ' worked';
    return s > d ? days + '  ·  ' + s + ' shifts' : days;
  };

  // ------------------------------------------------------------------ report
  const report = {
    grain: ['day', 'week', 'month'].includes(startup.get('grain')) ? startup.get('grain') : 'month',
    date: /^\d{4}-\d{2}-\d{2}$/.test(startup.get('date') || '') ? startup.get('date') : null
  };

  function renderReport() {
    const box = $('#report');
    if (!report.date) report.date = (state.meta && state.meta.today) || new Date().toISOString().slice(0, 10);
    rememberView();

    const controls = el('div', { class: 'bar' }, [
      el('div', { class: 'grain' }, [
        ...['day', 'week', 'month'].map(g => el('button', {
          text: g[0].toUpperCase() + g.slice(1),
          'aria-pressed': String(report.grain === g),
          onclick: () => { report.grain = g; renderReport(); }
        })),
        el('input', {
          type: 'date', value: report.date,
          onchange: e => { report.date = e.target.value; renderReport(); }
        })
      ])
    ]);

    const body = el('div', {}, el('div', { class: 'empty', text: 'Loading…' }));
    box.replaceChildren(controls, body);

    api('GET', `/period?grain=${report.grain}&date=${report.date}`).then(d => {
      const t = d.totals;
      const cards = el('div', { class: 'cards' }, [
        card('Income', money(t.total_income), daysLine(t), 't-indigo', 'income'),
        card('Expenses', money(t.total_expenses), null, 't-rose', 'costs'),
        card('Net profit', money(t.net_profit), null, 't-green', 'net'),
        card('Per shift hour', money(t.earnings_per_shift_hour), numOrDash(t.shift_hours, 2) + ' shift hrs', 't-teal', 'clock'),
        card('Per active hour', money(t.earnings_per_active_hour), numOrDash(t.active_hours, 2) + ' active hrs', 't-violet', 'speed'),
        card('Per mile', money(t.earnings_per_mile), numOrDash(t.shift_miles, 1) + ' miles', 't-amber', 'mile')
      ]);

      // data-label is what the stacked phone layout prints in place of the
      // header row, so no column can be lost to a narrow screen.
      const src = el('table', { class: 'rpt-table' }, [
        el('thead', {}, el('tr', {}, ['Service', 'Income', 'Deliveries', 'Hours', 'Per hour'].map((h, i) =>
          el('th', { class: i ? 'num' : '', text: h })))),
        el('tbody', {}, d.bySource.length
          ? d.bySource.map(b => el('tr', {}, [
              el('td', { 'data-label': 'Service' }, el('span', {
                class: 'pill ' + (b.source === 'Doordash' ? 'dd'
                  : b.source === 'Uber Eats' ? 'eats'
                  : b.source === 'Uber' ? 'uber' : ''),
                text: b.source
              })),
              el('td', { class: 'num', 'data-label': 'Income', text: money(b.income) }),
              el('td', { class: 'num', 'data-label': 'Deliveries', text: String(b.deliveries) }),
              el('td', { class: 'num', 'data-label': 'Hours', text: numOrDash(b.hours, 2) }),
              el('td', { class: 'num', 'data-label': 'Per hour' }, [
                el('span', { text: b.per_hour === null ? '—' : money(b.per_hour) }),
                el('div', { class: 'thin', text: coverageNote(b.coverage).trim() })
              ])
            ]))
          : [el('tr', {}, el('td', { colspan: 5, class: 'empty', text: 'No income in this period.' }))])
      ]);

      const exp = d.expensesByType.length ? el('table', { class: 'rpt-table' }, [
        el('thead', {}, el('tr', {}, ['Category', 'Count', 'Amount'].map((h, i) =>
          el('th', { class: i ? 'num' : '', text: h })))),
        el('tbody', {}, d.expensesByType.map(e => el('tr', {}, [
          el('td', { 'data-label': 'Category', text: e.type || 'Uncategorised' }),
          el('td', { class: 'num', 'data-label': 'Count', text: String(e.count) }),
          el('td', { class: 'num', 'data-label': 'Amount', text: money(e.amount) })
        ])))
      ]) : el('div', { class: 'muted', text: 'No expenses in this period.' });

      const shifts = el('div', {}, d.shifts.length
        ? d.shifts.map(sh => childCard(
            sh.record_no + '  ·  ' + sh.shift_date,
            money(sh.total_income),
            dayName(sh.day_of_week) + '  ·  ' + numOrDash(sh.shift_hours, 2) + ' hrs  ·  ' +
              sh.income_count + ' income, ' + sh.expense_count + ' expenses',
            () => openDetail('shift', sh.id)))
        : [el('div', { class: 'muted', text: 'No shifts in this period.' })]);

      const excludedNote = el('div', { class: 'thin', style: 'margin-top:18px' });
      body.replaceChildren(
        el('div', { class: 'rpt-h', text: d.label + '   (' + d.start + ' to ' + d.end + ')' }),
        cards,
        el('div', { class: 'rpt-h', text: 'By service' }), src,
        rideTypes(d),
        el('div', { class: 'rpt-h', text: 'Expenses by category' }), exp,
        el('div', { class: 'rpt-h', text: 'Shifts' }), shifts,
        excludedNote
      );

      // Said once, at the foot of the page: the reported totals are smaller than
      // the lifetime figure on purpose, and this is by how much and why.
      api('GET', '/excluded').then(x => {
        if (!x.records) return;
        excludedNote.textContent =
          `Excludes ${x.records} bulk-imported records (${money(x.income)}, ` +
          `${x.first_date} to ${x.last_date}) held on a placeholder shift with no hours. ` +
          `They are kept in the database and in reconciliation, but no rate can be drawn from them.`;
      }).catch(() => {});
    }).catch(e => body.replaceChildren(el('div', { class: 'empty', text: e.message })));
  }

  // ------------------------------------------------------------- ride types
  // The question it answers: on average, do airport rides or reserved rides pay
  // more than the ordinary ones that pop up while driving? Opens on all time,
  // because a single month holds a handful of airport rides at most; the second
  // button narrows it to the period above.
  const rideScope = { allTime: true };
  const RIDE_LABELS = { regular: 'Regular', airport: 'Airport', reservation: 'Reservation' };
  const MIN_RIDES = 5;

  function rideTypes(period) {
    const box = el('div');
    const draw = () => {
      const q = rideScope.allTime ? '' : `?from=${period.start}&to=${period.end}`;
      const scope = el('div', { class: 'grain', style: 'margin-bottom:8px' },
        [['All rides', true], ['This ' + period.grain, false]].map(([t, all]) => el('button', {
          text: t, 'aria-pressed': String(rideScope.allTime === all),
          onclick: () => { rideScope.allTime = all; draw(); }
        })));
      const out = el('div', {}, el('div', { class: 'muted', text: 'Loading…' }));
      box.replaceChildren(el('div', { class: 'rpt-h', text: 'Airport and reservation rides (Uber)' }), scope, out);

      api('GET', '/ride-types' + q).then(r => {
        const reg = r.groups.find(g => g.kind === 'regular');
        const more = (p, what) => p === null ? null
          : p === 0 ? `the same ${what}` : `${Math.abs(p)}% ${p > 0 ? 'more' : 'less'} ${what}`;

        // The answer in a sentence first, then the table it came from.
        const lines = r.groups.filter(g => g.kind !== 'regular').map(g => {
          const name = RIDE_LABELS[g.kind];
          if (!g.rides) return `No ${name.toLowerCase()} rides marked yet.`;
          if (!reg.rides) return `No regular rides to compare ${name.toLowerCase()} rides with yet.`;
          const bits = [more(g.vsRegular.perRide, 'per ride'), more(g.vsRegular.perHour, 'per hour of trip time')]
            .filter(Boolean);
          const early = g.rides < MIN_RIDES
            ? ` Only ${g.rides} so far, so this is an early read.` : '';
          return `${name} rides pay ${bits.join(' and ')} than regular rides.${early}`;
        });

        const pctCell = (g, key) => g.kind === 'regular' || g.vsRegular[key] === null ? ''
          : (g.vsRegular[key] > 0 ? '+' : '') + g.vsRegular[key] + '% vs regular';
        const table = el('table', { class: 'rpt-table' }, [
          el('thead', {}, el('tr', {}, ['Ride type', 'Rides', 'Per ride', 'Per hour', 'Per mile'].map((h, i) =>
            el('th', { class: i ? 'num' : '', text: h })))),
          el('tbody', {}, r.groups.map(g => el('tr', {}, [
            el('td', { 'data-label': 'Ride type', text: RIDE_LABELS[g.kind] }),
            el('td', { class: 'num', 'data-label': 'Rides', text: String(g.rides) }),
            ...[['perRide', 'Per ride'], ['perHour', 'Per hour'], ['perMile', 'Per mile']].map(([k, label]) =>
              el('td', { class: 'num', 'data-label': label }, [
                el('span', { text: money(g[k]) }),
                el('div', { class: 'thin', text: pctCell(g, k) })
              ]))
          ])))
        ]);

        const notes = [
          ...(rideScope.allTime && r.since ? [`Every Uber ride since ${r.since}, not counting the bulk import.`] : []),
          'Per hour is trip time from the receipt — the drive out to a reservation and any wait for the rider are not on it.'
        ];
        if (r.both) notes.push(`${r.both} ride${r.both === 1 ? ' was' : 's were'} both, and count in both rows.`);
        const untimed = r.groups.filter(g => g.rides && g.ridesTimed < g.rides);
        if (untimed.length) notes.push('Per hour and per mile use only the rides with a time or distance recorded.');

        out.replaceChildren(
          ...lines.map(t => el('div', { style: 'font-size:14px;margin:4px 0', text: t })),
          table,
          el('div', { class: 'thin', style: 'margin-top:6px', text: notes.join(' ') })
        );
      }).catch(e => out.replaceChildren(el('div', { class: 'muted', text: e.message })));
    };
    draw();
    return box;
  }

  // ---- the income row's graphics -----------------------------------------
  // Same lettermarks and colours as the dashboard's service rows.
  const SRC_MARK = { 'Uber': 'U', 'Uber Eats': 'UE', 'Doordash': 'DD' };
  const srcClass = s => s === 'Uber' ? 'src-uber' : s === 'Uber Eats' ? 'src-eats'
                      : s === 'Doordash' ? 'src-dd' : 'src-other';

  /**
   * One trip as a bar: what the platform paid in its full colour, the tip in a
   * lighter step of the same colour. Length is against the biggest trip on the
   * page. On a phone the Tips column is hidden, so this is the only place a tip
   * shows in the list at all - which is why it carries a label for screen
   * readers rather than being purely decorative.
   */
  function tripBar(r, max) {
    const paid = (Number(r.amount) || 0) + (Number(r.surge_bonus) || 0);
    const tip = Number(r.tips) || 0;
    const total = paid + tip;
    if (!max || total <= 0) return null;
    // Off the scale: keep the paid/tip proportion honest across the full length,
    // and mark the bar so "full" is never read as "exactly the top of the range".
    const capped = total > max;
    const pct = v => capped ? (v / total) * 100 : (v / max) * 100;
    const label = 'Paid ' + money(paid) + (tip ? ', tipped ' + money(tip) : ', no tip') +
                  (capped ? ' — larger than this page’s scale' : '');
    return el('div', { class: 'trip-track ' + srcClass(r.source) + (capped ? ' capped' : ''),
                       role: 'img', 'aria-label': label, title: label }, [
      paid > 0 ? el('i', { class: 'paid', style: 'width:' + pct(paid) + '%' }) : null,
      tip > 0  ? el('i', { class: 'tip',  style: 'width:' + pct(tip) + '%' })  : null
    ].filter(Boolean));
  }

  // Line icons, matching the dashboard. Stroke-only so each takes its card's tone
  // from currentColor; not emoji, which render differently on every device.
  const RPT_ICONS = {
    income:  'M12 3v18M16 7H10a2.5 2.5 0 0 0 0 5h4a2.5 2.5 0 0 1 0 5H8',
    costs:   'M3 7h18v12H3zM3 7l2-3h14l2 3M9 12h6',
    net:     'M3 17l6-6 4 4 7-7M14 8h7v7',
    speed:   'M12 14a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM13.4 10.6 18 6M3.5 19a9 9 0 1 1 17 0',
    clock:   'M12 7v5l3 2M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0',
    mile:    'M12 21s7-6.3 7-11a7 7 0 1 0-14 0c0 4.7 7 11 7 11zM12 12a2 2 0 1 0 0-4 2 2 0 0 0 0 4z'
  };
  const rptIcon = name => {
    const NS = 'http://www.w3.org/2000/svg';
    const s = document.createElementNS(NS, 'svg');
    s.setAttribute('viewBox', '0 0 24 24');
    s.setAttribute('aria-hidden', 'true');
    for (const d of (RPT_ICONS[name] || '').split('M').filter(Boolean)) {
      const p = document.createElementNS(NS, 'path');
      p.setAttribute('d', 'M' + d);
      s.append(p);
    }
    return s;
  };

  const card = (k, v, sub, tone, ic) => el('div', { class: 'card' + (tone ? ' ' + tone : '') }, [
    el('div', { class: 'card-head' }, [
      ic ? el('div', { class: 'chip' }, rptIcon(ic)) : null,
      el('div', { class: 'k', text: k })
    ].filter(Boolean)),
    el('div', { class: 'v', text: v }),
    sub ? el('div', { class: 's', text: sub }) : null
  ]);

  const childCard = (title, right, sub, onclick) => el('div', { class: 'child', onclick }, [
    el('div', { class: 'top' }, [el('strong', { text: title }), el('span', { text: right })]),
    sub ? el('div', { class: 'muted', text: sub }) : null
  ]);

  // ------------------------------------------------------------ detail view
  // Read-only on purpose: tapping a record should let you look at it without
  // any risk of changing it. Editing stays where it was, behind the Edit button.
  const detailStack = [];

  function kv(pairs) {
    const dl = el('dl', { class: 'kv' });
    for (const [k, v] of pairs) {
      if (v === null || v === undefined || v === '') continue;
      dl.append(el('dt', { text: k }), el('dd', { text: String(v) }));
    }
    return dl;
  }

  async function openDetail(kind, id, push = true) {
    const dlg = $('#detail');
    if (push) detailStack.push({ kind, id });
    $('#detail-back').hidden = detailStack.length < 2;
    $('#detail-body').replaceChildren(el('div', { class: 'empty', text: 'Loading…' }));
    $('#detail-title').textContent = 'Loading…';
    if (!dlg.open) dlg.showModal();

    try {
      if (kind === 'shift') return renderShiftDetail(await api('GET', '/shifts/' + id));
      if (kind === 'week') return renderWeekDetail(await api('GET', '/weeks/' + id));
      if (kind === 'income') return renderIncomeDetail(await api('GET', '/income/' + id));
      if (kind === 'expense') return renderExpenseDetail(await api('GET', '/expenses/' + id));
      if (kind === 'find') return renderFind(await api('GET', '/find?q=' + encodeURIComponent(id)));
      if (kind === 'month') {
        // A month has no record of its own; jump the Report tab at it instead.
        dlg.close();
        report.grain = 'month';
        report.date = id;
        selectTab('report');
        return;
      }
    } catch (e) {
      $('#detail-title').textContent = 'Not available';
      $('#detail-body').replaceChildren(el('div', { class: 'empty', text: e.message }));
    }
  }

  function renderShiftDetail(d) {
    const sh = d.shift;
    $('#detail-title').textContent = sh.record_no + '  ·  ' + sh.shift_date;
    const parts = [
      kv([
        ['Day', dayName(sh.day_of_week)],
        ['Clock in', sh.clock_in ? new Date(sh.clock_in).toLocaleString() : '—'],
        ['Clock out', sh.clock_out ? new Date(sh.clock_out).toLocaleString() : (sh.is_open ? 'Still open' : '—')],
        ['Shift hours', numOrDash(sh.shift_hours, 2)],
        ['Active hours', numOrDash(sh.total_active_time_hours, 2)],
        ['DoorDash dash time', numOrDash(sh.doordash_dash_time_hours, 2)],
        ['DoorDash active time', sh.doordash_active_time_hours === null ? 'not recorded' : numOrDash(sh.doordash_active_time_hours, 2)],
        ['Miles', numOrDash(sh.total_shift_miles, 1)],
        ['Income', money(sh.total_income)],
        ['Expenses', money(sh.total_expenses)],
        ['Net', money(sh.net_profit)],
        ['Per shift hour', money(sh.earnings_per_shift_hour)],
        ['Per active hour', money(sh.earnings_per_active_hour)]
      ])
    ];
    if (needsHours(sh)) {
      parts.push(el('div', { class: 'thin', text: 'No hours recorded, so the rates above read higher than they were.' }));
    }
    if (d.week) {
      parts.push(el('div', { class: 'rpt-h', text: 'Week' }));
      parts.push(childCard(d.week.record_no, money(d.week.weekly_total_income),
        d.week.start_date + ' to ' + d.week.end_date, () => openDetail('week', d.week.id)));
    }
    parts.push(el('div', { class: 'rpt-h', text: `Income records (${d.income.length})` }));
    parts.push(...(d.income.length
      ? d.income.map(i => childCard(i.record_no + '  ·  ' + i.source, money(i.total_earnings),
          [i.store, i.tips ? 'tips ' + money(i.tips) : null, i.time_taken_minutes ? i.time_taken_minutes + ' min' : null]
            .filter(Boolean).join('  ·  '),
          () => openDetail('income', i.id)))
      : [el('div', { class: 'muted', text: 'None.' })]));
    parts.push(el('div', { class: 'rpt-h', text: `Expenses (${d.expenses.length})` }));
    parts.push(...(d.expenses.length
      ? d.expenses.map(x => childCard(x.record_no + '  ·  ' + (x.type || 'Other'), money(x.amount),
          x.store || '', () => {}))
      : [el('div', { class: 'muted', text: 'None.' })]));
    $('#detail-body').replaceChildren(...parts.filter(Boolean));
  }

  const FIND_KINDS = [
    ['income', 'Income records', 'income', 'Income'],
    ['expense', 'Expenses', 'expenses', 'Expenses'],
    ['shift', 'Shifts', 'shifts', 'Shifts'],
    ['week', 'Weeks', 'weeks', 'Weeks']
  ];

  function renderFind(d) {
    $('#detail-title').textContent = `Find "${d.q}"`;
    const parts = [];
    for (const [kind, heading, tab, tabName] of FIND_KINDS) {
      const hits = d.hits.filter(h => h.kind === kind);
      if (!hits.length) continue;
      parts.push(el('div', { class: 'rpt-h', text: heading }));
      parts.push(...hits.map(h => childCard(`${h.record_no}  ·  ${h.date}`, money(h.amount),
        kind === 'shift' ? dayName(h.label) : h.label, () => openDetail(kind, h.id))));
      // More than fit here: the tab's own list, searched the same way, pages them.
      if (d.more[kind]) parts.push(el('button', {
        class: 'link-btn', text: `See them all on ${tabName}`,
        onclick: () => { $('#detail').close(); state.filter = { q: d.q }; selectTab(tab); }
      }));
    }
    $('#detail-body').replaceChildren(...(parts.length
      ? parts : [el('div', { class: 'empty', text: 'Nothing matches.' })]));
  }

  function renderWeekDetail(d) {
    const w = d.week;
    $('#detail-title').textContent = w.record_no + '  ·  ' + w.start_date + ' to ' + w.end_date;
    const parts = [
      kv([
        ['Income', money(w.weekly_total_income)],
        ['Expenses', money(w.weekly_total_expenses)],
        ['Net profit', money(w.net_profit)],
        ['Shift hours', numOrDash(w.weekly_shift_hours, 2)],
        ['Active hours', numOrDash(w.weekly_active_hours, 2)],
        ['Uber active hours', numOrDash(w.weekly_uber_active_hours, 2)],
        ['Shift miles', numOrDash(w.weekly_shift_miles, 1)],
        ['Per active hour', money(w.earnings_per_active_hour)],
        ['Per shift hour', money(w.earnings_per_shift_hour)],
        ['Per mile', money(w.true_earnings_per_mile)],
        ['Days worked', w.days_worked],
        ['Shifts', w.shifts_worked]
      ]),
      el('div', { class: 'rpt-h', text: 'By service' })
    ];
    parts.push(...(d.bySource.length
      ? d.bySource.map(b => childCard(b.source, money(b.income),
          b.deliveries + ' deliveries  ·  ' + numOrDash(b.hours, 2) + ' hrs' +
          (Number(b.hours) > 0 ? '  ·  ' + money(Number(b.income_timed) / Number(b.hours)) + '/hr' : ''),
          () => {}))
      : [el('div', { class: 'muted', text: 'No income this week.' })]));
    parts.push(el('div', { class: 'rpt-h', text: `Shifts (${d.shifts.length})` }));
    parts.push(...(d.shifts.length
      ? d.shifts.map(sh => childCard(sh.record_no + '  ·  ' + sh.shift_date, money(sh.total_income),
          dayName(sh.day_of_week) + '  ·  ' + numOrDash(sh.shift_hours, 2) + ' hrs  ·  ' +
            sh.income_count + ' income, ' + sh.expense_count + ' expenses',
          () => openDetail('shift', sh.id)))
      : [el('div', { class: 'muted', text: 'None.' })]));
    $('#detail-body').replaceChildren(...parts);
  }

  function renderIncomeDetail(d) {
    const i = d.income;
    $('#detail-title').textContent = i.record_no + '  ·  ' + i.source;
    const parts = [
      kv([
        ['Date', i.income_date],
        ['Service', i.source],
        ['Store', i.store],
        ['Base pay', money(i.amount)],
        ['Tips', i.tips === null ? '—' : money(i.tips)],
        ['Surge bonus', i.surge_bonus === null ? '—' : money(i.surge_bonus)],
        ['Total earnings', money(i.total_earnings)],
        ['Uber level', i.uber_level],
        ['Miles driven', i.miles_driven === null ? '—' : numOrDash(i.miles_driven, 1)],
        ['Time taken', i.time_taken_minutes === null ? 'not recorded' : i.time_taken_minutes + ' min'],
        ['Notes', i.notes]
      ])
    ];

    // Ride type, ticked straight from here because this is where a missed airport
    // or a reservation gets noticed - on the phone, record open. Each tap saves.
    if (i.source === 'Uber') {
      const flag = (key, col, label) => {
        const box = el('input', { type: 'checkbox', checked: i[col] ? 'checked' : null });
        box.addEventListener('change', async () => {
          box.disabled = true;
          try {
            const r = await api('PATCH', `/income/${i.id}/flags`, { [key]: box.checked });
            i[col] = r[col];
            toast(`${i.record_no}: ${label.toLowerCase()} ${r[col] ? 'ticked' : 'cleared'}`);
            load();
          } catch (e) {
            box.checked = !box.checked;
            toast(e.message, true);
          } finally {
            box.disabled = false;
          }
        });
        return el('label', { style: 'display:flex;align-items:center;gap:8px;font-size:14px;padding:6px 0' },
          [box, el('span', { text: label })]);
      };
      parts.push(el('div', { class: 'rpt-h', text: 'Ride type' }));
      parts.push(flag('isAirport', 'is_airport', 'Airport ride'));
      parts.push(flag('isReservation', 'is_reservation', 'Reservation'));
    }

    parts.push(shotBlock('income', i.id, 'Screenshot', 'The screenshot this record was read from'));
    if (d.shift) parts.push(...shiftBlock(d.shift));
    parts.push(...deleteBlock('income', i.id, i.record_no));
    $('#detail-body').replaceChildren(...parts);
  }

  /** An expense, laid out like an income record so the two read the same way -
      including the receipt it was read from, which Pixit has been keeping all along. */
  function renderExpenseDetail(d) {
    const x = d.expense;
    $('#detail-title').textContent = x.record_no + '  ·  ' + (x.type || 'Expense');
    const where = [x.store_city, x.store_state].filter(Boolean).join(', ');
    const parts = [
      kv([
        ['Date', x.expense_date],
        ['Type', x.type || 'Uncategorised'],
        ['Store', x.store],
        ['Where', where || null],
        ['Amount', money(x.amount)],
        ['Note', x.type_explanation]
      ])
    ];
    parts.push(shotBlock('expenses', x.id, 'Receipt', 'The receipt this expense was read from'));
    if (d.shift) parts.push(...shiftBlock(d.shift));
    parts.push(...deleteBlock('expenses', x.id, x.record_no));
    $('#detail-body').replaceChildren(...parts);
  }

  // ---- blocks both detail panels share ------------------------------------

  // The image a record was read from, when Pixit kept one. Requested
  // unconditionally and removed if it 404s, so neither record has to carry an
  // extra field whose only job is to say whether an image exists - and a record
  // typed by hand, or pushed before 17 Sep, simply shows no image block.
  function shotBlock(kind, recordId, title, alt) {
    const url = '/api/records/' + kind + '/' + recordId + '/shot';
    const img = el('img', {
      src: url, alt,
      style: 'max-width:100%;border:1px solid var(--border);border-radius:8px;margin-top:8px;cursor:zoom-in',
      onclick: () => window.open(url, '_blank', 'noopener')
    });
    const block = el('div', {}, [el('div', { class: 'rpt-h', text: title }), img]);
    img.addEventListener('error', () => block.remove());
    return block;
  }

  function shiftBlock(shift) {
    return [
      el('div', { class: 'rpt-h', text: 'Shift' }),
      childCard(shift.record_no + '  ·  ' + shift.shift_date, money(shift.total_income),
        dayName(shift.day_of_week), () => openDetail('shift', shift.id))
    ];
  }

  // The row's own Delete is hidden under 640px on purpose - it is the one
  // irreversible control on the page and a car is no place for a stray tap. But
  // hiding it left no way at all to remove a record from a phone, which is where
  // duplicates actually get noticed. Here it takes two deliberate taps to reach,
  // open the record first, which is the same protection without the dead end.
  function deleteBlock(kind, recordId, recordNo) {
    return [
      el('div', { class: 'rpt-h', text: 'Delete' }),
      el('div', {}, el('button', {
        class: 'danger',
        text: 'Delete ' + recordNo,
        onclick: async () => {
          await remove(kind, recordId, recordNo);
          detailStack.length = 0;
          $('#detail').close();
        }
      }))
    ];
  }

  function selectTab(name) {
    document.querySelectorAll('.tab').forEach(x => x.setAttribute('aria-selected', String(x.dataset.tab === name)));
    state.tab = name;
    state.offset = 0;
    renderFilters();
    load();
  }

  // The record tabs that search, and what each box says it takes. Months has no
  // record of its own to find.
  const SEARCH_HINT = {
    income: 'INC-1913, Chipotle, 7.51, 9/25…',
    expenses: 'EXP-0042, Shell, 12.50, 9/25…',
    shifts: 'DCF-0119, INC-1913, 9/25, Chipotle…',
    weeks: 'WCF-0030, DCF-0119, 9/25…'
  };

  function renderFilters() {
    const f = $('#filters');
    f.replaceChildren();
    const dateField = (key, label) => el('div', { class: 'field' }, [
      el('label', { text: label, for: 'f-' + key }),
      el('input', {
        type: 'date', id: 'f-' + key, value: state.filter[key] || '',
        onchange: e => { state.filter[key] = e.target.value; state.offset = 0; load(); }
      })
    ]);
    if (SEARCH_HINT[state.tab]) {
      // First in the row, and it searches as he types: finding INC-1913 should not
      // mean paging through 38 pages or knowing to press Enter. The server reads a
      // number as a record or an amount, so 1913, INC-1913, 7.51 and 9/25 all work,
      // on every record tab.
      let typing;
      const search = () => {
        clearTimeout(typing);
        // Gone if he switched tabs while the timer ran.
        if (!$('#f-q')) return;
        const v = $('#f-q').value.trim();
        if (v === (state.filter.q || '')) return;
        state.filter.q = v; state.offset = 0; load();
      };
      f.append(el('div', { class: 'field search-field' }, [
        el('label', { text: 'Search', for: 'f-q' }),
        el('input', {
          type: 'search', id: 'f-q', placeholder: SEARCH_HINT[state.tab], value: state.filter.q || '',
          autocomplete: 'off', enterkeyhint: 'search',
          oninput: () => { clearTimeout(typing); typing = setTimeout(search, 350); },
          onchange: search
        })
      ]));
    }
    f.append(dateField('from', 'From'), dateField('to', 'To'));

    if (state.tab === 'income') {
      f.append(el('div', { class: 'field' }, [
        el('label', { text: 'Platform', for: 'f-source' }),
        el('select', {
          id: 'f-source',
          onchange: e => { state.filter.source = e.target.value; state.offset = 0; load(); }
        }, [el('option', { value: '', text: 'All' })].concat(
          state.meta.sources.map(s => el('option', {
            value: s, text: s, selected: state.filter.source === s ? 'selected' : null
          }))))
      ]));
      // Ride type and bonus: with the date and platform, enough to ask "what do my
      // reservations pay" from the phone without anyone writing a report.
      const pick = (key, label, options) => el('div', { class: 'field' }, [
        el('label', { text: label, for: 'f-' + key }),
        el('select', {
          id: 'f-' + key,
          onchange: e => { state.filter[key] = e.target.value; state.offset = 0; load(); }
        }, options.map(([v, t]) => el('option', {
          value: v, text: t, selected: (state.filter[key] || '') === v ? 'selected' : null
        })))
      ]);
      f.append(pick('ride', 'Ride type', [['', 'All'], ['regular', 'Regular'], ['airport', 'Airport'], ['reservation', 'Reservation']]));
      // A second filter, not more choices in Ride type: the level is the product he
      // was sent, ride type is how it was booked. The list is whatever the records
      // hold, so a new Uber product appears here the day Pixit first reads one.
      f.append(pick('level', 'Uber level', [['', 'All']]
        .concat((state.meta.uberLevels || []).map(l => [l, l]))
        .concat([[state.meta.noLevel || '(none)', 'Not recorded']])));
      f.append(pick('bonus', 'Surge / bonus', [['', 'Any'], ['with', 'Has a bonus'], ['none', 'No bonus']]));
    }
    if (state.tab === 'shifts') {
      f.append(el('div', { class: 'field' }, [
        el('label', { text: 'Show', for: 'f-needs' }),
        el('select', {
          id: 'f-needs',
          onchange: e => { state.filter.needsClockOut = e.target.value; state.offset = 0; load(); }
        }, [
          el('option', { value: '', text: 'All shifts', selected: state.filter.needsClockOut ? null : 'selected' }),
          el('option', { value: '1', text: 'Needs a clock-out', selected: state.filter.needsClockOut ? 'selected' : null })
        ])
      ]));
    }
    if (state.tab === 'expenses') {
      f.append(el('div', { class: 'field' }, [
        el('label', { text: 'Type', for: 'f-type' }),
        el('select', {
          id: 'f-type',
          onchange: e => { state.filter.type = e.target.value; state.offset = 0; load(); }
        }, [el('option', { value: '', text: 'All' })].concat(
          state.meta.expenseTypes.map(t => el('option', {
            value: t, text: t, selected: state.filter.type === t ? 'selected' : null
          }))))
      ]));
    }
    f.append(el('div', { class: 'field' }, [
      el('label', { text: ' ' }),
      el('button', { text: 'Clear', onclick: () => { state.filter = {}; state.offset = 0; renderFilters(); load(); } })
    ]));
  }

  // The address bar carries the view, so pull-to-refresh on a phone - which reloads
  // the page - lands back where he was instead of on Income. Same parameters the
  // dashboard's links already use to open a tab, so one reader serves both.
  // replaceState, not pushState: a tab change is not somewhere Back should go.
  function rememberView() {
    const p = new URLSearchParams();
    if (state.tab !== 'income') p.set('tab', state.tab);
    for (const k of ['from', 'to', 'source', 'type', 'q', 'ride', 'level', 'bonus']) if (state.filter[k]) p.set(k, state.filter[k]);
    if (state.filter.needsClockOut) p.set('needs', 'clockout');
    if (state.tab === 'report') {
      if (report.grain !== 'month') p.set('grain', report.grain);
      if (report.date && report.date !== (state.meta && state.meta.today)) p.set('date', report.date);
    }
    const qs = p.toString();
    try { history.replaceState(null, '', location.pathname + (qs ? '?' + qs : '')); } catch {}
  }

  // Searching as he types can put two loads in flight; only the latest may draw,
  // or a slow answer for "19" lands on top of the one for "1913".
  let loadSeq = 0;

  async function load() {
    const seq = ++loadSeq;
    rememberView();
    // The report is not a table, so it takes the whole panel instead.
    const isReport = state.tab === 'report';
    $('#report').hidden = !isReport;
    $('#table-wrap').hidden = isReport;
    $('#add-btn').hidden = !['income', 'expenses', 'shifts'].includes(state.tab);
    if (isReport) {
      $('#summary').replaceChildren();
      $('#pager').replaceChildren();
      $('#bulk').hidden = true;
      return renderReport();
    }

    const cfg = TABS[state.tab];
    $('#tbl').dataset.tab = state.tab;
    $('#thead').replaceChildren(el('tr', {}, cfg.columns.map(c =>
      el('th', { class: /Base|Tips|Bonus|Total|Miles|Mins|Amount|Hours|Income|Expenses|Net|\$/.test(c) ? 'num' : '', text: c }))));
    $('#tbody').replaceChildren(el('tr', {}, el('td', { colspan: cfg.columns.length, class: 'empty', text: 'Loading…' })));

    try {
      const data = await cfg.load();
      if (seq !== loadSeq) return;
      const rows = data.records || [];
      // A row only sees itself, so anything it draws to scale needs the page's
      // largest value handed to it first.
      state.pageMax = cfg.scale ? cfg.scale(rows) : null;
      $('#tbody').replaceChildren(...(rows.length
        ? rows.map(r => {
            const tr = cfg.row(r);
            // Tapping a row reads it. Buttons inside the row still do their own
            // job, so Edit and Delete are unaffected.
            const kind = cfg.detail || (state.tab === 'shifts' ? 'shift'
                        : state.tab === 'income' ? 'income'
                        : state.tab === 'expenses' ? 'expense' : null);
            if (kind) {
              tr.classList.add('tappable');
              tr.addEventListener('click', ev => {
                if (ev.target.closest('button, a, input, select, textarea')) return;
                openDetail(kind, kind === 'month' ? r.month_start : r.id);
              });
            }
            return tr;
          })
        : [el('tr', {}, el('td', { colspan: cfg.columns.length, class: 'empty',
            text: state.filter.q && SEARCH_HINT[state.tab] ? `Nothing matches "${state.filter.q}".` : 'Nothing here yet.' }))]));

      const bits = cfg.summary(data);
      const un = state.meta.unlinked;
      if (state.tab === 'income' && un.income) bits.push(`${un.income} not linked to a shift`);
      if (state.tab === 'expenses' && un.expenses) bits.push(`${un.expenses} not linked to a shift`);
      $('#summary').replaceChildren(...bits.map(b => el('span', { html: b.replace(/^([\d$.,]+)/, '<b>$1</b>') })));

      renderBulk(data);
      renderPager(data);
    } catch (e) {
      if (seq !== loadSeq) return;
      $('#tbody').replaceChildren(el('tr', {}, el('td', {
        colspan: cfg.columns.length, class: 'empty', text: e.message
      })));
      $('#summary').replaceChildren();
      $('#pager').replaceChildren();
      $('#bulk').hidden = true;
    }
  }

  // Tick Reservation on everything the filters show, for the case that started it:
  // filter to Uber, no bonus, the right dates, look the list over, tick them all.
  // Only once the list is Uber - a bulk action whose count includes deliveries it
  // will not touch would say one number and do another. The server re-counts and
  // refuses if the list changed after it was shown.
  function renderBulk(data) {
    const box = $('#bulk');
    box.replaceChildren();
    const n = data && data.total;
    box.hidden = !(state.tab === 'income' && state.filter.source === 'Uber' && n > 0 && n <= 500);
    if (box.hidden) return;
    const filter = {};
    for (const k of ['from', 'to', 'source', 'q', 'ride', 'level', 'bonus']) if (state.filter[k]) filter[k] = state.filter[k];
    const go = async (on) => {
      const what = `${on ? 'Tick' : 'Clear'} Reservation on all ${n} ride${n === 1 ? '' : 's'} in this list?` +
        (n > (data.records || []).length ? `\n\nThat includes ${n - data.records.length} on later pages.` : '');
      if (!confirm(what)) return;
      try {
        const r = await api('POST', '/income/bulk-flags', { filter, expect: n, isReservation: on });
        toast(`${on ? 'Ticked' : 'Cleared'} Reservation on ${r.updated} ride${r.updated === 1 ? '' : 's'}`);
        load();
      } catch (e) {
        toast(e.message, true);
      }
    };
    box.append(
      el('button', { text: `Mark these ${n} as reservations`, onclick: () => go(true) }),
      el('button', { text: 'Unmark them', onclick: () => go(false) })
    );
  }

  function renderPager(data) {
    const p = $('#pager');
    p.replaceChildren();
    if (state.tab === 'shifts' || !data.total || data.total <= state.limit) return;
    const page = Math.floor(state.offset / state.limit) + 1;
    const pages = Math.ceil(data.total / state.limit);
    p.append(
      el('button', {
        text: '← Newer', disabled: state.offset === 0 ? 'disabled' : null,
        onclick: () => { state.offset = Math.max(0, state.offset - state.limit); load(); }
      }),
      el('span', { class: 'muted', style: 'align-self:center', text: `page ${page} of ${pages}` }),
      el('button', {
        text: 'Older →', disabled: page >= pages ? 'disabled' : null,
        onclick: () => { state.offset += state.limit; load(); }
      })
    );
  }

  // -------------------------------------------------------------------- form
  const FORMS = {
    income: (r = {}) => [
      ['incomeDate', 'Date', 'date', r.income_date || state.meta.today, true],
