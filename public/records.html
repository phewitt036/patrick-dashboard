      ['source', 'Platform', 'select', r.source || 'Uber', true, state.meta.sources],
      ['amount', 'Base pay', 'number', r.amount ?? '', true, null, 'Zero is fine — a cancellation still pays the tip'],
      ['tips', 'Tips', 'number', r.tips ?? ''],
      ['surgeBonus', 'Surge / bonus', 'number', r.surge_bonus ?? ''],
      ['store', 'Store', 'text', r.store ?? ''],
      ['milesDriven', 'Miles driven', 'number', r.miles_driven ?? ''],
      ['totalMiles', 'Total miles', 'number', r.total_miles ?? '', false, null, 'Including the drive to pickup'],
      ['timeTakenMinutes', 'Time (minutes)', 'number', r.time_taken_minutes ?? '', false, null, 'Minutes, not hours'],
      ['uberLevel', 'Uber level', 'text', r.uber_level ?? '', false, null, 'Uber and Uber Eats only'],
      ['isAirport', 'Airport ride', 'checkbox', !!r.is_airport, false, null, 'Started or ended at an airport'],
      ['isReservation', 'Reservation', 'checkbox', !!r.is_reservation, false, null, 'Booked ahead, not a ride that popped up'],
      ['notes', 'Notes', 'textarea', r.notes ?? '']
    ],
    expenses: (r = {}) => [
      ['expenseDate', 'Date', 'date', r.expense_date || state.meta.today, true],
      ['type', 'Type', 'select', r.type || 'Food', false, state.meta.expenseTypes],
      ['amount', 'Amount', 'number', r.amount ?? '', true],
      ['store', 'Store', 'text', r.store ?? ''],
      ['typeExplanation', 'Note', 'textarea', r.type_explanation ?? '']
    ],
    shifts: (r = {}) => [
      ['shiftDate', 'Date', 'date', r.shift_date || state.meta.today, true],
      ['clockIn', 'Clock in', 'datetime-local', toLocalInput(r.clock_in)],
      ['clockOut', 'Clock out', 'datetime-local', toLocalInput(r.clock_out), false, null, 'Leave blank to keep it open'],
      ['totalShiftMiles', 'Shift miles', 'number', r.total_shift_miles ?? ''],
      ['doordashDashTimeHours', 'DoorDash dash time (hours)', 'number', r.doordash_dash_time_hours ?? '']
    ]
  };

  const LABELS = { income: 'income record', expenses: 'expense', shifts: 'shift' };

  function openForm(kind, record) {
    state.editing = record ? { kind, id: record.id } : { kind, id: null };
    $('#dlg-title').textContent = (record ? 'Edit ' : 'New ') + LABELS[kind];
    const body = $('#dlg-body');
    body.replaceChildren();

    for (const [name, label, type, value, required, options, hint] of FORMS[kind](record || {})) {
      let input;
      if (type === 'select') {
        input = el('select', { name, id: 'i-' + name },
          (required ? [] : [el('option', { value: '', text: '—' })]).concat(
            options.map(o => el('option', { value: o, text: o, selected: value === o ? 'selected' : null }))));
      } else if (type === 'checkbox') {
        input = el('input', { type, name, id: 'i-' + name, checked: value ? 'checked' : null,
                              style: 'align-self:flex-start' });
      } else if (type === 'textarea') {
        input = el('textarea', { name, id: 'i-' + name, rows: 2 });
        input.value = value ?? '';
      } else {
        input = el('input', {
          type, name, id: 'i-' + name,
          step: type === 'number' ? 'any' : null,
          inputmode: type === 'number' ? 'decimal' : null,
          value: value ?? ''
        });
      }
      body.append(el('div', { class: type === 'textarea' ? 'field full' : 'field' }, [
        el('label', { text: label + (required ? ' *' : ''), for: 'i-' + name }),
        input,
        hint ? el('span', { class: 'hint', text: hint }) : null
      ]));
    }
    $('#dlg').showModal();
    body.querySelector('input, select, textarea')?.focus();
  }

  function showError(msg, field) {
    const body = $('#dlg-body');
    body.querySelectorAll('.err').forEach(n => n.remove());
    body.prepend(el('div', { class: 'err', text: msg }));
    if (field) document.getElementById('i-' + field)?.focus();
  }

  async function save() {
    const { kind, id } = state.editing;
    const payload = {};
    for (const [name, , type] of FORMS[kind]({})) {
      const node = document.getElementById('i-' + name);
      if (!node) continue;
      let v = type === 'checkbox' ? node.checked : node.value;
      if (type === 'datetime-local') v = fromLocalInput(v);
      payload[name] = v === '' ? null : v;
    }
    try {
      const path = '/' + kind + (id ? '/' + id : '');
      const saved = await api(id ? 'PATCH' : 'POST', path, payload);
      $('#dlg').close();
      if (kind === 'shifts' && saved.adopted && (saved.adopted.income || saved.adopted.expenses)) {
        toast(`Shift saved — picked up ${saved.adopted.income} income and ${saved.adopted.expenses} expense records from that day`);
      } else {
        toast(`${id ? 'Updated' : 'Added'} ${saved.record_no || ''}`.trim());
      }
      state.meta = await api('GET', '/meta');
      load();
    } catch (e) {
      showError(e.message);
    }
  }

  async function remove(kind, id, label) {
    const what = kind === 'shifts'
      ? `Delete shift ${label}?\n\nIts income and expense records are kept — they just stop being linked to a shift.`
      : `Delete ${label}?`;
    if (!confirm(what)) return;
    try {
      const r = await api('DELETE', `/${kind}/${id}`);
      toast(kind === 'shifts' && r.unlinked
        ? `Deleted ${label} — ${r.unlinked.income} income and ${r.unlinked.expenses} expense records kept`
        : `Deleted ${label}`);
      state.meta = await api('GET', '/meta');
      load();
    } catch (e) {
      toast(e.message, true);
    }
  }

  // ------------------------------------------------------------------- wiring
  document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.setAttribute('aria-selected', String(x === t)));
    state.tab = t.dataset.tab;
    state.offset = 0;
    renderFilters();
    load();
  }));
  $('#detail-x').addEventListener('click', () => { detailStack.length = 0; $('#detail').close(); });
  // Typing a record's number opens that record. Anything else - or a number that
  // is several records, or a record and an amount - lists the matches by type.
  $('#find').addEventListener('submit', async e => {
    e.preventDefault();
    const q = $('#find-q').value.trim();
    if (!q) return;
    detailStack.length = 0;
    try {
      const d = await api('GET', '/find?q=' + encodeURIComponent(q));
      const exact = d.hits.filter(h => h.exact);
      const only = exact.length === 1 ? exact[0] : d.hits.length === 1 ? d.hits[0] : null;
      if (only) openDetail(only.kind, only.id);
      else openDetail('find', q);
      $('#find-q').blur();
    } catch (err) {
      toast(err.message, true);
    }
  });
  $('#detail').addEventListener('close', () => { detailStack.length = 0; });
  $('#detail-back').addEventListener('click', () => {
    detailStack.pop();
    const prev = detailStack[detailStack.length - 1];
    if (prev) openDetail(prev.kind, prev.id, false);
  });
  $('#add-btn').addEventListener('click', () => openForm(state.tab, null));
  $('#save').addEventListener('click', save);
  $('#cancel').addEventListener('click', () => $('#dlg').close());
  $('#dlg-x').addEventListener('click', () => $('#dlg').close());
  $('#form').addEventListener('submit', e => { e.preventDefault(); save(); });

  (async () => {
    try {
      state.meta = await api('GET', '/meta');
    } catch (e) {
      $('#tbody').replaceChildren(el('tr', {}, el('td', {
        colspan: 6, class: 'empty',
        text: 'Cannot reach the records API. Is DATABASE_URL set on the server? (' + e.message + ')'
      })));
      return;
    }
    // The markup hard-codes Income as the selected tab; arriving on another one
    // loaded the right data under the wrong highlight.
    document.querySelectorAll('.tab').forEach(t =>
      t.setAttribute('aria-selected', String(t.dataset.tab === state.tab)));
    renderFilters();
    if (Object.keys(startFilter).length) {
      const bar = $('#filters'), toggle = $('#filter-toggle');
      if (bar) bar.classList.add('open');
      if (toggle) toggle.setAttribute('aria-expanded', 'true');
    }
    load();
  })();
})();
</script>
<!-- Installed as an app, this page never reloads itself: going back to it resumes
     whatever was loaded, so a deploy can sit unseen all day - on 2026-10-16 the
     expense receipts were live on boss for an hour while the phone still ran the
     old page. On each return it asks the server for this page's fingerprint (the
     ETag the server already sends) and, if the file has changed, OFFERS a reload.
     It never forces one: a half-filled form must not vanish under him. -->
<style>
  #update-bar {
    position: fixed; left: 12px; right: 12px; bottom: 14px; z-index: 100;
    max-width: 520px; margin: 0 auto;
    display: flex; align-items: center; gap: 12px; justify-content: space-between;
    padding: 11px 12px 11px 16px; border-radius: 12px;
    background: #b45309; color: #fff;
    font: 600 14px system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    box-shadow: 0 8px 24px rgba(16,24,40,.24);
  }
  #update-bar[hidden] { display: none; }
  #update-bar button {
    background: #fff; color: #b45309; border: 0; border-radius: 999px;
    padding: 9px 16px; min-height: 40px; font: inherit; font-weight: 700; cursor: pointer;
  }
</style>
<div id="update-bar" role="status" hidden>
  <span>Patforce has been updated.</span>
  <button type="button" id="update-go">Reload</button>
</div>
<script>
(() => {
  const bar = document.getElementById('update-bar');
  const fingerprint = async () => {
    const r = await fetch(location.pathname, { method: 'HEAD', cache: 'no-store', credentials: 'same-origin' });
    // A lapsed session redirects to the login page, whose fingerprint differs.
    // That is not an update, so it is not reported as one.
    return (r.ok && !r.redirected) ? r.headers.get('etag') : null;
  };
  let loaded = null;
  fingerprint().then(t => { loaded = t; }).catch(() => {});
  document.addEventListener('visibilitychange', async () => {
    if (document.visibilityState !== 'visible' || !loaded) return;
    const now = await fingerprint().catch(() => null);
    if (now && now !== loaded) bar.hidden = false;
  });
  document.getElementById('update-go').addEventListener('click', () => location.reload());
})();
</script>
</body>
</html>
